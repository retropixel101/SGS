<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGS Browser Policy Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #090909;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  header {
    padding: 18px 22px;
    background: #e00000;
    box-shadow: 0 3px 18px #e0000066;
  }
  h1 { margin: 0 0 5px; font-size: 24px; }
  .sub { opacity: .85; font-size: 14px; }
  main { max-width: 1000px; margin: 28px auto; padding: 0 18px; }
  .panel {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  button {
    border: 1px solid #f22;
    background: #191919;
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    margin: 4px;
  }
  button:hover { background: #292929; }
  #results { display: grid; gap: 8px; }
  .result {
    padding: 11px 13px;
    border-radius: 8px;
    background: #202020;
    border-left: 5px solid #777;
  }
  .pass { border-left-color: #20c878; }
  .fail { border-left-color: #ff3b3b; }
  .warn { border-left-color: #f2b84b; }
  iframe {
    width: 100%;
    height: 220px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #000;
  }
  code { color: #ff8a8a; }
</style>
</head>
<body>
<header>
  <h1>SGS / Chrome Policy Diagnostic</h1>
  <div class="sub">Tests browser capabilities without attempting to circumvent administrative restrictions.</div>
</header>

<main>
  <div class="panel">
    <button onclick="runTests()">Run Tests</button>
    <button onclick="clearResults()">Clear</button>
    <div id="results" style="margin-top:12px"></div>
  </div>

  <div class="panel">
    <h2>Controlled iframe test</h2>
    <p>This iframe contains a harmless test document generated by this page. It does not load a game or proxy another website.</p>
    <iframe id="testFrame" title="Controlled iframe test"></iframe>
  </div>
</main>

<script>
function addResult(name, state, detail) {
  const el = document.createElement('div');
  el.className = 'result ' + state;
  el.innerHTML = '<strong>' + name + '</strong><br><span>' + detail + '</span>';
  document.getElementById('results').appendChild(el);
}

function clearResults() {
  document.getElementById('results').innerHTML = '';
}

function runTests() {
  clearResults();

  addResult(
    'JavaScript',
    'pass',
    'JavaScript executed successfully.'
  );

  addResult(
    'Canvas',
    typeof HTMLCanvasElement !== 'undefined' ? 'pass' : 'fail',
    typeof HTMLCanvasElement !== 'undefined'
      ? 'HTML5 Canvas API is available.'
      : 'HTML5 Canvas API is unavailable.'
  );

  let blobOK = false;
  try {
    const b = new Blob(['<p>Blob test</p>'], {type:'text/html'});
    const u = URL.createObjectURL(b);
    blobOK = !!u;
    URL.revokeObjectURL(u);
  } catch (e) {}

  addResult(
    'Blob URLs',
    blobOK ? 'pass' : 'fail',
    blobOK ? 'Blob URL creation is permitted.' : 'Blob URL creation failed.'
  );

  let dataOK = false;
  try {
    const u = 'data:text/html,<p>Data URL test</p>';
    dataOK = u.startsWith('data:');
  } catch (e) {}

  addResult(
    'Data URL construction',
    dataOK ? 'pass' : 'fail',
    dataOK ? 'The page can construct a data URL.' : 'Data URL construction failed.'
  );

  let storageOK = false;
  try {
    localStorage.setItem('__sgs_test', '1');
    localStorage.removeItem('__sgs_test');
    storageOK = true;
  } catch (e) {}

  addResult(
    'Local storage',
    storageOK ? 'pass' : 'warn',
    storageOK ? 'localStorage is available.' : 'localStorage is restricted or unavailable.'
  );

  let webglOK = false;
  try {
    const c = document.createElement('canvas');
    webglOK = !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
  } catch (e) {}

  addResult(
    'WebGL',
    webglOK ? 'pass' : 'warn',
    webglOK ? 'WebGL context was created.' : 'WebGL context could not be created.'
  );

  const frame = document.getElementById('testFrame');
  frame.onload = () => addResult(
    'Controlled iframe navigation',
    'pass',
    'A same-page generated document loaded inside an iframe.'
  );
  frame.srcdoc = '<!doctype html><html><body style="margin:0;background:#111;color:#fff;font:20px Arial;display:grid;place-items:center;height:100vh"><div>Iframe test loaded successfully.</div></body></html>';

  addResult(
    'Fullscreen API',
    document.fullscreenEnabled ? 'pass' : 'warn',
    document.fullscreenEnabled
      ? 'Fullscreen API is exposed.'
      : 'Fullscreen API is unavailable or restricted.'
  );
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGS Game Diagnostic v2</title>
<style>
body{margin:0;padding:16px;background:#0b0b0c;color:#eee;font:14px system-ui,sans-serif}
h1{margin:0 0 4px;font-size:22px}.sub{color:#aaa;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap}input{flex:1 1 500px;padding:10px;background:#151516;color:#fff;border:1px solid #444;border-radius:6px}
button{padding:10px 14px;border:0;border-radius:6px;background:#e11;color:#fff;font-weight:700}
button.secondary{background:#333}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:10px;margin-top:10px}
.panel{background:#151516;border:1px solid #29292b;border-radius:8px;overflow:hidden}.title{padding:9px;font-weight:800;border-bottom:1px solid #29292b}
#game{width:100%;height:600px;border:0;background:#111}#results{height:580px;overflow:auto;padding:8px}
.row{padding:8px;margin-bottom:6px;background:#1e1e20;border-radius:5px;word-break:break-word}
.ok{border-left:4px solid #21c46b}.bad{border-left:4px solid #f04444}.warn{border-left:4px solid #e7b83f}.info{border-left:4px solid #4a9eff}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>SGS Game Diagnostic v2</h1>
<div class="sub">Diagnostic only. It does not bypass network or school restrictions. It checks what the browser can load from the supplied game page.</div>
<div class="bar">
<input id="url" placeholder="Paste the full HTTPS game HTML URL here">
<button id="load">Load Game</button><button id="test" class="secondary">Run Diagnostics</button><button id="clear" class="secondary">Clear</button>
</div>
<div class="grid">
<section class="panel"><div class="title">Game</div><iframe id="game" allowfullscreen></iframe></section>
<section class="panel"><div class="title">Diagnostic Results</div><div id="results"></div></section>
</div>

<script>
const $=id=>document.getElementById(id), results=$("results"), frame=$("game");
function log(type,msg){let d=document.createElement("div");d.className="row "+type;d.textContent=msg;results.appendChild(d);results.scrollTop=results.scrollHeight}
function clearLog(){results.innerHTML=""}
function getURL(){try{let u=new URL($("url").value.trim(),location.href);return /^https?:$/.test(u.protocol)?u.href:null}catch(e){return null}}
async function req(url,label){
  let t=performance.now();
  try{
    let r=await fetch(url,{cache:"no-store"});
    log(r.ok?"ok":"bad",label+": HTTP "+r.status+" "+r.statusText+" ("+Math.round(performance.now()-t)+" ms)");
    return r;
  }catch(e){log("bad",label+": REQUEST FAILED — "+(e.message||e));return null}
}
async function diagnostics(){
  clearLog(); log("info","=== SGS GAME DIAGNOSTIC v2 ===");
  let url=getURL();
  log("info","Browser: "+navigator.userAgent);log("info","Online: "+navigator.onLine);
  log("info","Viewport: "+innerWidth+" × "+innerHeight);
  if(!url){log("bad","Enter a full http:// or https:// game URL.");return}
  log("info","Target: "+url);
  log("info","--- Browser capabilities ---");
  let c=document.createElement("canvas"), c2=!!c.getContext("2d"), gl=false;
  try{gl=!!(c.getContext("webgl")||c.getContext("experimental-webgl"))}catch(e){}
  log(c2?"ok":"bad","Canvas 2D: "+(c2?"AVAILABLE":"FAILED"));
  log(gl?"ok":"warn","WebGL: "+(gl?"AVAILABLE":"UNAVAILABLE"));
  log((typeof WebAssembly!=="undefined")?"ok":"bad","WebAssembly: "+((typeof WebAssembly!=="undefined")?"AVAILABLE":"UNAVAILABLE"));
  log("info","--- Game HTML request ---");
  let r=await req(url,"Game HTML");
  if(r){
    try{
      let text=await r.text();
      log("ok","Game HTML downloaded ("+text.length.toLocaleString()+" characters)");
      let doc=new DOMParser().parseFromString(text,"text/html");
      let scripts=[...doc.scripts].map(x=>x.src||"(inline)");
      let css=[...doc.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href||x.getAttribute("href"));
      let imgs=[...doc.images].map(x=>x.src||x.getAttribute("src"));
      log("info","Scripts found: "+scripts.length);
      scripts.forEach((x,i)=>log("info","SCRIPT "+(i+1)+": "+x));
      log("info","Stylesheets found: "+css.length);
      css.forEach((x,i)=>log("info","CSS "+(i+1)+": "+x));
      log("info","Images found: "+imgs.length);
      for(const x of scripts)if(/^https?:/i.test(x))await req(x,"Script");
      for(const x of css)if(/^https?:/i.test(x))await req(x,"Stylesheet");
    }catch(e){log("bad","HTML parsing failed: "+e)}
  }
  log("info","--- Iframe load ---");
  let fired=false, start=performance.now();
  frame.onload=()=>{fired=true;log("ok","Iframe load event fired after "+Math.round(performance.now()-start)+" ms.");
    try{
      let d=frame.contentDocument;
      if(d){log("ok","Iframe document accessible. Title: "+(d.title||"(none)"));log(d.querySelector("canvas")?"ok":"warn","Canvas in iframe: "+(d.querySelector("canvas")?"FOUND":"NOT FOUND"))}
      else log("warn","Iframe loaded but its document is not accessible (likely cross-origin).")
    }catch(e){log("warn","Iframe loaded but cross-origin inspection is blocked.")}
  };
  frame.onerror=()=>log("bad","Iframe reported an error event.");
  frame.src=url;
  setTimeout(()=>{if(!fired)log("bad","Iframe did not fire load after 15 seconds.")},15000);
  log("info","GREEN = observed success. YELLOW = warning/limitation. RED = observed failure.");
  log("info","A 200 response does not guarantee a game initializes; later JS/assets can still fail.");
}
$("load").onclick=()=>{let u=getURL();if(!u){log("bad","Enter a valid HTTP(S) URL.");return}frame.src=u;log("info","Loading iframe: "+u)};
$("test").onclick=diagnostics;$("clear").onclick=clearLog;
</script>
</body>
</html>

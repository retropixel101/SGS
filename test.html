<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS Embed Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
.controls{width:min(1060px,calc(100% - 24px));margin:14px auto 10px;display:flex;gap:8px}
#gamePath{flex:1;min-width:0;padding:10px 12px;border:1px solid #444;border-radius:6px;background:#151515;color:#fff;outline:none}
button{padding:10px 14px;border:0;border-radius:6px;background:#e11;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#c00}
.gameContent,.hero,.wrapper{width:100%}
.wrapper{margin:0 auto}
.wrapper center{display:block}
.gameFrameWrap{width:min(1060px,calc(100% - 24px));height:650px;margin:0 auto;background:#111;overflow:hidden}
#gameFrame{display:block;width:100%;height:100%;border:0;margin:0;padding:0}
@media(max-width:700px){.controls{flex-direction:column}.gameFrameWrap{height:70vh}}
</style>
</head>
<body>
<div class="controls">
<input id="gamePath" type="text" placeholder="Enter game path or URL">
<button id="loadButton">Load Game</button>
<button id="fullscreenButton">Fullscreen</button>
</div>

<main class="gameContent" id="gameContent">
<div class="hero">
<div class="wrapper">
<center>
<div class="gameFrameWrap" id="gameFrameWrap">
<iframe id="gameFrame" width="1060" height="650"
src="about:blank" marginwidth="0" marginheight="0"
hspace="0" vspace="0" frameborder="0" scrolling="no"
allowfullscreen></iframe>
</div>
</center>
</div>
</div>
</main>

<script>
const input=document.getElementById("gamePath");
const frame=document.getElementById("gameFrame");
const frameWrap=document.getElementById("gameFrameWrap");

function loadGame(){
  const value=input.value.trim();
  if(!value){alert("Enter a game path or URL first.");return;}
  try{
    frame.src=new URL(value,window.location.href).href;
  }catch(e){alert("Invalid game path or URL.");}
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    frameWrap.requestFullscreen().catch(()=>alert("Fullscreen was not allowed by the browser."));
  }else{
    document.exitFullscreen();
  }
}

document.getElementById("loadButton").addEventListener("click",loadGame);
document.getElementById("fullscreenButton").addEventListener("click",toggleFullscreen);
input.addEventListener("keydown",e=>{if(e.key==="Enter")loadGame();});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS Embed Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080808;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
body{padding:20px}
.wrap{width:min(1200px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:clamp(20px,3vw,30px)}
.status{color:#9a9a9a;font-size:13px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-bottom:12px}
input,button{min-height:42px;border:1px solid #292929;border-radius:8px;font:inherit}
input{width:100%;padding:0 13px;background:#111;color:#f5f5f5;outline:none}
input:focus{border-color:#555}
button{padding:0 16px;background:#171717;color:#f5f5f5;cursor:pointer}
button:hover{background:#202020}
.game-shell{width:100%;aspect-ratio:1060/650;min-height:300px;overflow:hidden;border:1px solid #292929;border-radius:10px;background:#000}
#gameFrame{display:block;width:100%;height:100%;border:0}
.help{margin-top:10px;color:#9a9a9a;font-size:12px;line-height:1.5}
@media(max-width:650px){
 body{padding:12px}
 .topbar{align-items:flex-start;flex-direction:column}
 .controls{grid-template-columns:1fr 1fr}
 .controls input{grid-column:1/-1}
 button{width:100%}
 .game-shell{min-height:220px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <h1>SGS Embed Test</h1>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="controls">
    <input id="gamePath" type="text"
      placeholder="HTML Path Here..."
      autocomplete="off" spellcheck="false">
    <button id="loadBtn" type="button">Load</button>
    <button id="fullscreenBtn" type="button">Fullscreen</button>
  </div>

  <div class="game-shell" id="gameShell">
    <iframe id="gameFrame" title="SGS Game Embed"
      frameborder="0" scrolling="no"
      allowfullscreen allow="fullscreen"></iframe>
  </div>

  <div class="help">
    Enter a relative game path or an embeddable URL, then press Load.
  </div>
</main>

<script>
const input=document.getElementById("gamePath");
const frame=document.getElementById("gameFrame");
const shell=document.getElementById("gameShell");
const status=document.getElementById("status");

function setStatus(text){status.textContent=text}

function loadGame(){
  const value=input.value.trim();
  if(!value){setStatus("Enter a game path first");input.focus();return}
  setStatus("Loading...");
  try{frame.src=value}
  catch(error){setStatus("Could not set iframe source");console.error(error)}
}

function fullscreenGame(){
  if(document.fullscreenElement){
    document.exitFullscreen?.();
    return;
  }
  if(shell.requestFullscreen){
    shell.requestFullscreen().catch(()=>setStatus("Fullscreen was blocked by the browser"));
  }else{
    setStatus("Fullscreen is not supported");
  }
}

frame.addEventListener("load",()=>setStatus("Frame loaded"));
document.getElementById("loadBtn").addEventListener("click",loadGame);
document.getElementById("fullscreenBtn").addEventListener("click",fullscreenGame);
input.addEventListener("keydown",e=>{if(e.key==="Enter")loadGame()});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Game Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      box-sizing: border-box;
      background: #151515;
    }

    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 6px;
      background: #252525;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      margin-left: auto;
      font-size: 13px;
      color: #aaa;
    }

    .game-container {
      width: 100%;
      height: calc(100vh - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: min(1060px, 100%);
      height: min(650px, calc(100vh - 50px));
      border: 0;
      background: black;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button onclick="reloadGame()">Reload</button>
    <button onclick="fullscreenGame()">Fullscreen</button>
    <span id="status">Loading...</span>
  </div>

  <div class="game-container">
    <iframe
      id="gameFrame"
      src="https://dnrwegffuwjtx.cloudfront.net/games/2025/more/elastic-man/gm/index.html"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const frame = document.getElementById("gameFrame");
    const status = document.getElementById("status");

    frame.addEventListener("load", () => {
      status.textContent = "Iframe document loaded";
    });

    function reloadGame() {
      status.textContent = "Reloading...";
      frame.src = frame.src;
    }

    function fullscreenGame() {
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      }
    }
  </script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Bowl Diagnostic</title>
<style>
  html,body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}
  #top{padding:14px;border-bottom:1px solid #333;position:sticky;top:0;background:#111;z-index:10}
  button{padding:9px 13px;margin:4px;border:1px solid #555;border-radius:6px;background:#222;color:#fff;cursor:pointer}
  button:hover{background:#333}
  #status{margin:10px 4px;font-weight:bold}
  #checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;padding:10px}
  .check{padding:10px;background:#151515;border:1px solid #333;border-radius:6px}
  .ok{border-color:#247a3b}.bad{border-color:#8a2525}.warn{border-color:#806b22}
  .label{font-weight:bold}.detail{font-size:12px;color:#bbb;margin-top:5px;word-break:break-word}
  #gameWrap{margin:10px;padding:10px;background:#000;border:1px solid #333;text-align:center}
  #canvas{width:min(960px,100%);height:auto;background:#000;display:block;margin:auto}
  #log{margin:10px;padding:10px;background:#050505;border:1px solid #333;white-space:pre-wrap;font:12px monospace;max-height:300px;overflow:auto}
</style>
</head>
<body>
<div id="top">
  <button id="diagBtn">Run diagnostics</button>
  <button id="gameBtn">Load Retro Bowl</button>
  <button id="clearBtn">Clear log</button>
  <div id="status">Ready.</div>
</div>

<div id="checks"></div>

<div id="gameWrap">
  <canvas id="canvas" width="960" height="540">
    Canvas fallback text.
  </canvas>
</div>

<div id="log">Diagnostic log:
</div>

<script>
(function () {
  "use strict";

  var CDN = "https://cdn.jsdelivr.net/gh/selenite-cc/selenite-old@9c743188888af0986c8c7b293dbac8f9e421a4ee/retrobowl/";
  var GAME = CDN + "html5game/RetroBowl.js?WAEAC=1633155445";
  var SPLASH = CDN + "html5game/splash.png";
  var checks = document.getElementById("checks");
  var logBox = document.getElementById("log");
  var status = document.getElementById("status");
  var gameLoaded = false;

  function log(msg) {
    logBox.textContent += new Date().toLocaleTimeString() + "  " + msg + "\n";
    logBox.scrollTop = logBox.scrollHeight;
  }

  function check(name, state, detail) {
    var box = document.createElement("div");
    box.className = "check " + state;
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = name + ": " + state.toUpperCase();
    var d = document.createElement("div");
    d.className = "detail";
    d.textContent = detail || "";
    box.appendChild(label);
    box.appendChild(d);
    checks.appendChild(box);
  }

  function clearChecks() {
    checks.textContent = "";
  }

  window.addEventListener("error", function (e) {
    var target = e.target;
    if (target && target !== window && target.tagName) {
      log("RESOURCE ERROR: " + target.tagName + " " + (target.src || target.href || ""));
    } else {
      log("JS ERROR: " + e.message + " @ " + e.filename + ":" + e.lineno + ":" + e.colno);
    }
  }, true);

  window.addEventListener("unhandledrejection", function (e) {
    log("UNHANDLED PROMISE: " + String(e.reason));
  });

  function runDiagnostics() {
    clearChecks();
    status.textContent = "Running diagnostics...";
    log("===== diagnostics started =====");

    check("JavaScript", "ok", "This diagnostic script is executing.");

    var c = document.getElementById("canvas");
    check("Canvas element", c ? "ok" : "bad",
      c ? "Found #canvas, size " + c.width + "x" + c.height + "." : "Could not find #canvas.");

    var ctx = null;
    try { ctx = c.getContext("2d"); } catch (e) { log("2D context exception: " + e); }
    check("Canvas 2D", ctx ? "ok" : "bad",
      ctx ? "2D context was created successfully." : "2D context could not be created.");

    var gl = null;
    try {
      gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    } catch (e) { log("WebGL exception: " + e); }
    check("WebGL", gl ? "ok" : "warn",
      gl ? "WebGL context was created." : "WebGL context unavailable (not necessarily fatal for this game).");

    check("requestAnimationFrame", typeof window.requestAnimationFrame === "function" ? "ok" : "bad",
      typeof window.requestAnimationFrame === "function" ? "API is available." : "API is missing.");

    check("Keyboard API", typeof window.addEventListener === "function" ? "ok" : "bad",
      "Event listener API is available.");

    var img = new Image();
    img.onload = function () {
      check("splash.png", "ok", "Loaded successfully: " + img.naturalWidth + "x" + img.naturalHeight);
      log("splash.png loaded.");
    };
    img.onerror = function () {
      check("splash.png", "bad", "The browser could not load the CDN image.");
      log("splash.png FAILED: " + SPLASH);
    };
    img.src = SPLASH;

    var base = document.createElement("base");
    base.href = CDN;
    check("Game CDN", "ok", "Game assets are expected at the Selenite CDN URL.");

    check("GameMaker_Init before load",
      typeof window.GameMaker_Init === "function" ? "ok" : "warn",
      typeof window.GameMaker_Init === "function"
        ? "Already defined."
        : "Not defined yet; this is normal before RetroBowl.js loads.");

    status.textContent = "Diagnostics finished. Check the results above.";
    log("===== diagnostics finished =====");
  }

  function loadGame() {
    if (gameLoaded) {
      log("RetroBowl.js was already requested.");
      return;
    }

    status.textContent = "Loading RetroBowl.js...";
    log("Requesting: " + GAME);

    var script = document.createElement("script");
    script.type = "text/javascript";
    script.src = GAME;

    script.onload = function () {
      gameLoaded = true;
      log("RetroBowl.js LOAD EVENT fired.");
      check("RetroBowl.js", "ok", "The browser reported the script loaded.");
      check("GameMaker_Init after load",
        typeof window.GameMaker_Init === "function" ? "ok" : "bad",
        typeof window.GameMaker_Init === "function"
          ? "GameMaker_Init exists."
          : "Script loaded but GameMaker_Init was not created.");

      if (typeof window.GameMaker_Init === "function") {
        log("Calling GameMaker_Init()...");
        try {
          window.GameMaker_Init();
          status.textContent = "GameMaker_Init() was called. Watch the canvas and log.";
          log("GameMaker_Init() returned without throwing.");
        } catch (e) {
          status.textContent = "GameMaker_Init() THREW an error.";
          log("GameMaker_Init EXCEPTION: " + (e && e.stack ? e.stack : e));
          check("GameMaker_Init execution", "bad", String(e));
        }
      }
    };

    script.onerror = function () {
      status.textContent = "RetroBowl.js FAILED TO LOAD.";
      log("RetroBowl.js ERROR EVENT fired.");
      check("RetroBowl.js", "bad",
        "The browser refused or failed to load the game script. This is the most important result.");
    };

    document.head.appendChild(script);
  }

  document.getElementById("diagBtn").addEventListener("click", runDiagnostics);
  document.getElementById("gameBtn").addEventListener("click", loadGame);
  document.getElementById("clearBtn").addEventListener("click", function () {
    logBox.textContent = "Diagnostic log:\n";
  });

  runDiagnostics();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGS Topbar</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}

/* =========================================================
   NAVBAR
   ========================================================= */

.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 100%;
  min-height: 58px;

  background: linear-gradient(
    90deg,
    #ff0000,
    #660000
  );

  box-shadow:
    0 0 20px #ff0000;

  padding: 9px 18px;

  position: relative;
  z-index: 10;

  gap: 20px;
}

/* =========================================================
   LEFT SIDE
   ========================================================= */

.left {
  display: flex;
  align-items: center;

  flex: 0 1 auto;
  min-width: 0;

  gap: 16px;

  white-space: nowrap;
}

.logo {
  font-size: 1.5em;
  font-weight: bold;

  white-space: nowrap;
}

.datetime {
  font-size: 0.9em;

  color: #ffd6d6;

  text-shadow:
    0 0 10px #ff0000;

  white-space: nowrap;
}

/* =========================================================
   CENTER / NAVIGATION
   ========================================================= */

.center {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  z-index: 3;
}

.tabs {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  flex-wrap: nowrap;
}

.tab {
  flex: 0 0 auto;

  background: #111;

  padding: 8px 13px;

  border-radius: 6px;

  color: #fff;

  font-size: 0.86em;

  white-space: nowrap;

  cursor: pointer;

  transition: 0.25s ease;

  text-decoration: none;
}

.tab:hover {
  transform: translateY(-1px);

  background: #222;

  box-shadow:
    0 0 10px #ff0000;
}

.tab.active {
  background: #330000;

  box-shadow:
    0 0 12px #ff0000;
}

/* =========================================================
   NAVBAR SCALING FIX
   ========================================================= */

/*
   Switch to the stacked layout early enough that the
   timestamp never gets squeezed into the navigation.
*/

@media (max-width: 1500px) {

  .navbar {
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 9px 12px 10px;

    min-height: auto;
  }

  .left {
    width: 100%;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px 14px;
  }

  .center {
    position: static;

    width: 100%;

    transform: none;
  }

  .tabs {
    width: 100%;

    justify-content: center;

    flex-wrap: wrap;

    gap: 6px;
  }

  .tab {
    flex: 0 0 auto;

    padding: 7px 11px;

    font-size: 0.82em;

    white-space: nowrap;
  }
}

/* =========================================================
   SMALLER SCREENS
   ========================================================= */

@media (max-width: 800px) {

  .navbar {
    padding: 8px 10px 9px;

    gap: 7px;
  }

  .left {
    flex-direction: column;

    gap: 3px;
  }

  .logo {
    font-size: 1.2em;
  }

  .datetime {
    font-size: 0.72em;
  }

  .tabs {
    gap: 4px;
  }

  .tab {
    padding: 6px 8px;

    font-size: 0.7em;
  }
}

/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media (max-width: 450px) {

  .navbar {
    padding: 7px 8px 8px;
  }

  .logo {
    font-size: 1.1em;
  }

  .datetime {
    font-size: 0.68em;
  }

  .tabs {
    gap: 3px;
  }

  .tab {
    padding: 6px 7px;

    font-size: 0.67em;
  }
}

</style>
</head>

<body>

<!-- =======================================================
     SGS TOPBAR
     ======================================================= -->

<div class="navbar">

  <div class="left">

    <div class="logo">
      Secret Game Site
    </div>

    <div class="datetime" id="datetime">
      Loading...
    </div>

  </div>


  <div class="center">

    <div class="tabs">

      <div class="tab active">
        Home
      </div>

      <div class="tab">
        Games
      </div>

      <div class="tab">
        Utilities
      </div>

      <div class="tab">
        Browser
      </div>

      <div class="tab">
        Music Player
      </div>

      <div class="tab">
        Forums
      </div>

      <div class="tab">
        Settings
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   LIVE DATE / TIME
   ========================================================= */

function updateDateTime() {

  const now = new Date();

  const month = now.toLocaleString('en-US', {
    month: 'long'
  });

  const day = now.getDate();

  const year = now.getFullYear();

  let hours = now.getHours();

  const minutes = String(
    now.getMinutes()
  ).padStart(2, '0');

  const seconds = String(
    now.getSeconds()
  ).padStart(2, '0');

  const ampm =
    hours >= 12
      ? "PM"
      : "AM";

  hours =
    hours % 12 || 12;

  document.getElementById(
    'datetime'
  ).textContent =
    `${month} ${day}, ${year} • ${hours}:${minutes}:${seconds} ${ampm}`;
}


/* =========================================================
   START CLOCK
   ========================================================= */

setInterval(
  updateDateTime,
  1000
);

updateDateTime();

</script>

</body>
</html>

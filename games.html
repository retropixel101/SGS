<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SGS • Games</title>

  <link
    rel="icon"
    type="image/png"
    href="Img/SGS.png"
  >


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

#vanta-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none !important;
  overflow: hidden;
}

.navbar,
.page {
  position: relative;
  z-index: 2;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  min-width: 0;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(255,0,0,.08),
      transparent 32%
    ),
    #080808;

  color: #fff;

  overflow-x: hidden;
}


/* =========================================================
   NAVBAR
   ========================================================= */

.navbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        linear-gradient(
            90deg,
            #ff0000,
            #660000
        );

    box-shadow:
        0 0 20px #ff0000;

    padding:
        12px 20px;

    position: sticky;

    top: 0;

    z-index: 10;

    width: 100vw;

    max-width: 100vw;
}


.left {

    display: flex;

    align-items: center;

    gap: 20px;
}


.logo {

    font-size: 1.5em;

    font-weight: bold;
}


.datetime {

    font-size: 0.95em;

    color: #ffd6d6;

    text-shadow:
        0 0 10px #ff0000;
}


.center {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);
}


.tabs {

    display: flex;

    gap: 10px;
}


.tab {

    display: block;

    background: #111;

    padding:
        8px 16px;

    border-radius: 6px;

    transition:
        0.3s ease;

    cursor: pointer;

    color: #fff;

    text-decoration: none;
}


.tab:hover {

    transform:
        translateY(-1px);

    background: #222;

    box-shadow:
        0 0 10px #ff0000;
}


.active {

    background: #330000;

    box-shadow:
        0 0 12px #ff0000;

    transform:
        scale(1.03);
}



/* =========================================================
   NAVBAR LEFT
   ========================================================= */

.left {
  display: flex;

  align-items: center;

  gap: 16px;

  min-width: 0;
}

.logo {
  font-size: 1.5em;

  font-weight: 800;

  white-space: nowrap;
}

.datetime {
  font-size: .9em;

  color: #ffd6d6;

  text-shadow:
    0 0 10px #ff0000;

  white-space: nowrap;
}


/* =========================================================
   NAVBAR CENTER
   ========================================================= */

.center {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);
}

.tabs {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 7px;

  flex-wrap: nowrap;
}

.tab {
  flex: 0 0 auto;

  border: 0;

  background: #111;

  color: #fff;

  padding:
    8px 13px;

  border-radius: 6px;

  transition:
    .25s ease;

  cursor: pointer;

  white-space: nowrap;

  font-family: inherit;

  font-size: .9em;
}

.tab:hover {
  transform:
    translateY(-1px);

  background: #222;

  box-shadow:
    0 0 10px #ff0000;
}

.tab.active {
  background: #330000;

  box-shadow:
    0 0 12px #ff0000;
}


/* =========================================================
   PAGE
   ========================================================= */

.page {
  width:
    min(
      1500px,
      calc(100% - 36px)
    );

  max-width: 1500px;

  margin:
    0 auto;

  padding:
    72px
    clamp(18px, 4vw, 55px)
    80px;

  position: relative;
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
  text-align: center;

  position: relative;

  margin-bottom: 42px;
}

.hero-glow {
  position: absolute;

  width:
    min(700px, 85vw);

  height: 260px;

  left: 50%;

  top: -55px;

  transform:
    translateX(-50%);

  background:
    radial-gradient(
      ellipse,
      rgba(255,0,0,.18),
      transparent 68%
    );

  filter:
    blur(10px);

  pointer-events: none;

  animation:
    pulse 4s ease-in-out infinite;
}

.hero > *:not(.hero-glow) {
  position: relative;

  z-index: 1;
}

.badge {
  display: inline-flex;

  align-items: center;

  gap: 8px;

  border:
    1px solid #660000;

  border-radius:
    999px;

  padding:
    7px 13px;

  color:
    #ff7777;

  background:
    rgba(20,0,0,.8);

  font-size:
    .75em;

  font-weight:
    800;

  letter-spacing:
    2px;

  box-shadow:
    0 0 16px rgba(255,0,0,.25);
}

.dot {
  width: 7px;

  height: 7px;

  border-radius: 50%;

  background:
    #ff2222;

  box-shadow:
    0 0 10px #ff0000;

  animation:
    blink 1.5s infinite;
}

.hero h1 {
  margin:
    18px 0 8px;

  font-size:
    clamp(
      2.5em,
      6vw,
      4em
    );

  color:
    #ff1111;

  text-shadow:
    0 0 20px #ff0000,
    0 0 45px rgba(255,0,0,.3);
}

.hero h1 span {
  color: #fff;

  text-shadow:
    0 0 14px #fff,
    0 0 28px rgba(255,0,0,.8);
}

.hero p {
  max-width:
    720px;

  margin:
    0 auto;

  color:
    #aaa;

  line-height:
    1.6;

  font-size:
    1.05em;
}


/* =========================================================
   SEARCH + FILTERS
   ========================================================= */

.controls {
  position: relative;

  z-index: 2;

  width:
    min(900px, 100%);

  margin:
    0 auto 38px;
}

.search-wrap {
  position: relative;
}

.search {
  width: 100%;

  height: 54px;

  padding:
    0 20px 0 50px;

  border:
    2px solid #3a0000;

  border-radius:
    12px;

  outline: none;

  background:
    #111;

  color:
    #fff;

  font-size:
    1em;

  box-shadow:
    0 0 18px rgba(255,0,0,.15);

  transition:
    .25s ease;
}

.search:focus {
  border-color:
    #ff0000;

  box-shadow:
    0 0 22px rgba(255,0,0,.35);
}

.search-icon {
  position: absolute;

  left: 18px;

  top: 50%;

  transform:
    translateY(-50%);

  color:
    #ff4444;

  pointer-events:
    none;
}

.filters {
  display: flex;

  justify-content: center;

  align-items: center;

  flex-wrap: wrap;

  gap: 9px;

  margin-top: 13px;

  width: 100%;
}

.filter {
  appearance: none;

  border:
    1px solid #431313;

  background:
    #101010;

  color:
    #aaa;

  border-radius:
    999px;

  padding:
    8px 15px;

  cursor:
    pointer;

  font:
    inherit;

  font-size:
    .84em;

  font-weight:
    600;

  line-height:
    1;

  white-space:
    nowrap;

  transition:
    transform .2s ease,
    color .2s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.filter:hover {
  color:
    #fff;

  border-color:
    #ff3333;

  background:
    #210000;

  transform:
    translateY(-2px);

  box-shadow:
    0 0 14px rgba(255,0,0,.22);
}

.filter.active {
  color:
    #fff;

  border-color:
    #ff1111;

  background:
    linear-gradient(
      180deg,
      #3b0000,
      #1d0000
    );

  box-shadow:
    0 0 16px rgba(255,0,0,.38),
    inset 0 0 8px rgba(255,0,0,.12);

  transform:
    translateY(-1px);
}


/* =========================================================
   GAME AREA
   ========================================================= */

.results-bar {
  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap: 15px;

  margin-bottom:
    18px;

  color:
    #777;

  font-size:
    .9em;
}

.results-bar strong {
  color:
    #ff5555;
}

.games-grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px, 300px)
    );

  justify-content:
    center;

  align-items:
    start;

  gap:
    34px 26px;
}

.game-card {
  width: 300px;

  max-width: 100%;

  background:
    linear-gradient(
      180deg,
      #151515,
      #0d0d0d
    );

  border:
    2px solid #300000;

  border-radius:
    14px;

  padding:
    12px 0 14px;

  overflow:
    hidden;

  box-shadow:
    0 0 15px rgba(255,0,0,.45);

  transition:
    .3s ease;

  animation:
    cardIn .55s ease both;
}

.game-card:hover {
  transform:
    translateY(-6px);

  border-color:
    #650000;

  box-shadow:
    0 0 28px rgba(255,0,0,.75);
}

.game-thumb {
  width:
    256px;

  height:
    256px;

  margin:
    0 auto;

  display:
    block;

  border-radius:
    8px;

  background:
    #151515
    center /
    cover
    no-repeat;

  box-shadow:
    0 0 0 1px #250000,
    0 0 14px rgba(255,0,0,.18);
}

.game-name {
  min-height:
    54px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    10px 16px 7px;

  font-size:
    1.18em;

  font-weight:
    750;

  color:
    #fff;
}

.game-bar {
  width:
    calc(100% - 20px);

  margin:
    0 auto;

  display:
    flex;

  gap:
    8px;

  padding:
    7px;

  background:
    #090909;

  border:
    2px solid #300000;

  border-radius:
    10px;
}

.game-bar button {
  flex:
    1;

  min-width:
    0;

  border:
    2px solid #ff0000;

  border-radius:
    8px;

  padding:
    8px 10px;

  background:
    #111;

  color:
    #fff;

  cursor:
    pointer;

  transition:
    .2s ease;
}

.game-bar button:hover {
  background:
    #330000;

  box-shadow:
    0 0 14px #ff3333;

  transform:
    translateY(-1px);
}

.empty {
  grid-column:
    1 / -1;

  text-align:
    center;

  padding:
    55px 20px;

  color:
    #777;

  border:
    1px dashed #3b1111;

  border-radius:
    14px;

  width:
    min(700px, 100%);
}


/* =========================================================
   MODALS
   ========================================================= */

.modal {
  display:
    none;

  position:
    fixed;

  inset:
    0;

  z-index:
    9999;

  background:
    rgba(0,0,0,.84);

  justify-content:
    center;

  align-items:
    center;

  padding:
    20px;

  backdrop-filter:
    blur(3px);
}

.modal.open {
  display:
    flex;
}


/* =========================================================
   LAUNCH OPTIONS
   ========================================================= */

#popup-box {
  width:
    min(700px, 95vw);

  background:
    #111;

  border:
    2px solid #ff0000;

  padding:
    28px;

  border-radius:
    14px;

  text-align:
    center;

  box-shadow:
    0 0 35px #ff0000;
}

.popup-header {
  position:
    relative;

  display:
    flex;

  justify-content:
    center;

  margin-bottom:
    22px;
}

.popup-header h3 {
  margin:
    0;

  font-size:
    1.45em;

  text-shadow:
    0 0 10px #ff0000;
}

.close {
  position:
    absolute;

  right:
    0;

  top:
    50%;

  transform:
    translateY(-50%);

  color:
    #ff4444;

  font-size:
    1.8em;

  cursor:
    pointer;
}

.close:hover {
  color:
    #fff;

  text-shadow:
    0 0 12px #ff0000;
}

.launch-grid {
  display:
    grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    12px;
}

.popup-btn {
  min-height:
    58px;

  border:
    2px solid #ff0000;

  border-radius:
    9px;

  background:
    #111;

  color:
    #fff;

  cursor:
    pointer;

  font-weight:
    600;

  transition:
    .2s ease;
}

.popup-btn:hover {
  background:
    #330000;

  box-shadow:
    0 0 18px #ff3333;

  transform:
    translateY(-2px);
}


function showPlayerInfo(type) {

  const labels = {
    controls: "Controls",
    howToPlay: "How to Play",
    sideNotes: "Side Notes"
  };

  playerGameInfoTitle.textContent =
    labels[type] || "Game Information";

  const text =
    currentGameDetails[type] ||
    "No information has been added yet.";

  document.getElementById("info-title").textContent =
    currentGameTitle || "Game";

  document.getElementById("info-category").textContent =
    labels[type] || "Game Information";

  document.getElementById("info-text").textContent =
    text;

  document.getElementById("info-popup").classList.add("open");

}


/* =========================================================
   INFO POPUP
   ========================================================= */

#info-popup-box {
  width:
    min(
      500px,
      calc(100vw - 32px)
    );

  max-height:
    min(
      430px,
      calc(100vh - 32px)
    );

  background:
    #0f0f0f;

  border:
    1px solid #ff2222;

  border-radius:
    14px;

  overflow:
    hidden;

  box-shadow:
    0 0 22px rgba(255,0,0,.55),
    0 0 60px rgba(255,0,0,.16);

  animation:
    infoIn .2s ease-out;
}

.info-header {
  position:
    relative;

  min-height:
    68px;

  display:
    flex;

  align-items:
    center;

  padding:
    16px 54px 16px 22px;

  border-bottom:
    1px solid #2b2b2b;

  background:
    linear-gradient(
      180deg,
      #171717,
      #101010
    );
}

.info-title {
  margin:
    0;

  font-size:
    1.35em;

  font-weight:
    750;

  color:
    #fff;

  text-shadow:
    0 0 10px rgba(255,0,0,.35);
}

.info-header .close {
  right:
    17px;

  font-size:
    1.45em;
}

.info-body {
  padding:
    18px 22px 20px;
}

.info-label {
  display:
    block;

  margin-bottom:
    8px;

  color:
    #ff4b4b;

  font-size:
    .72em;

  font-weight:
    800;

  letter-spacing:
    2px;

  text-transform:
    uppercase;
}

.info-text {
  margin:
    0;

  color:
    #ddd;

  line-height:
    1.55;

  font-size:
    .96em;
}

.info-footer {
  margin-top:
    17px;

  padding-top:
    13px;

  border-top:
    1px solid #292929;

  color:
    #777;

  font-size:
    .78em;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes pulse {

  0%,
  100% {
    opacity: .6;

    transform:
      translateX(-50%)
      scale(.97);
  }

  50% {
    opacity: 1;

    transform:
      translateX(-50%)
      scale(1.04);
  }

}

@keyframes blink {

  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }

}

@keyframes cardIn {

  from {
    opacity: 0;

    transform:
      translateY(12px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}

@keyframes infoIn {

  from {
    opacity: 0;

    transform:
      scale(.97)
      translateY(6px);
  }

  to {
    opacity: 1;

    transform:
      scale(1)
      translateY(0);
  }

}


/* =========================================================
   LARGE SCREENS
   ========================================================= */

@media (min-width: 1401px) {

  .navbar .left {
    position:
      absolute;

    left:
      18px;

    top:
      50%;

    transform:
      translateY(-50%);

    z-index:
      2;
  }

  .navbar .center {
    position:
      absolute;

    left:
      50%;

    top:
      50%;

    transform:
      translate(-50%, -50%);

    z-index:
      3;
  }

  .navbar .tabs {
    flex-wrap:
      nowrap;
  }

  .page {
    width:
      min(
        1500px,
        calc(100% - 36px)
      );

    margin:
      0 auto;
  }

}


/* =========================================================
   TABLET / CHROMEBOOK
   ========================================================= */

@media (max-width: 1400px) {

  .navbar {
    display:
      flex;

    flex-direction:
      column;

    align-items:
      center;

    justify-content:
      center;

    gap:
      8px;

    min-height:
      auto;

    padding:
      9px 12px 10px;
  }

  .navbar .left {
    width:
      100%;

    justify-content:
      center;

    flex-wrap:
      wrap;

    gap:
      7px 12px;
  }

  .navbar .center {
    position:
      static;

    width:
      100%;

    transform:
      none;
  }

  .navbar .tabs {
    width:
      100%;

    justify-content:
      center;

    flex-wrap:
      wrap;

    gap:
      5px;
  }

  .navbar .tab {
    padding:
      7px 10px;

    font-size:
      .86em;
  }

  .page {
    width:
      100%;

    max-width:
      1500px;

    margin:
      0 auto;

    padding:
      48px
      clamp(14px, 4vw, 55px)
      70px;
  }

  .games-grid {
    grid-template-columns:
      repeat(
        auto-fit,
        minmax(280px, 300px)
      );

    justify-content:
      center;

    gap:
      30px 18px;
  }

}


/* =========================================================
   SHORT SCREENS
   ========================================================= */

@media
(min-width: 1201px)
and (max-height: 700px) {

  .page {
    padding-top:
      42px;
  }

}


/* =========================================================
   SMALL TABLET
   ========================================================= */

@media (max-width: 900px) {

  .navbar {
    gap:
      7px;

    padding:
      8px 8px 9px;
  }

  .navbar .left {
    gap:
      5px 10px;
  }

  .navbar .tabs {
    gap:
      4px;
  }

  .navbar .tab {
    padding:
      6px 9px;

    font-size:
      .73em;
  }

  .page {
    padding:
      34px 12px 60px;
  }

  .hero h1 {
    font-size:
      clamp(
        2.05rem,
        7vw,
        3.1rem
      );
  }

  .hero p {
    width:
      min(100%, 700px);

    font-size:
      .94em;
  }

  .controls {
    width:
      min(100%, 760px);
  }

  .games-grid {
    grid-template-columns:
      repeat(
        auto-fit,
        minmax(260px, 300px)
      );

    justify-content:
      center;

    gap:
      24px 14px;
  }

  .game-card {
    width:
      min(
        300px,
        100%
      );
  }

}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

  .navbar .left {
    flex-direction:
      column;

    gap:
      2px;
  }

  .navbar .logo {
    font-size:
      1.2em;
  }

  .navbar .datetime {
    font-size:
      .68em;
  }

  .navbar .tabs {
    gap:
      4px;
  }

  .navbar .tab {
    padding:
      6px 7px;

    font-size:
      .68em;
  }

  .page {
    padding:
      28px 10px 50px;
  }

  .hero h1 {
    font-size:
      clamp(
        1.9rem,
        10vw,
        2.65rem
      );
  }

  .hero p {
    font-size:
      .9em;

    line-height:
      1.5;
  }

  .search {
    height:
      50px;

    padding-left:
      44px;
  }

  .filters {
    gap:
      6px;
  }

  .filter {
    padding:
      7px 10px;
  }

  .games-grid {
    grid-template-columns:
      1fr;

    gap:
      22px;
  }

  .game-card {
    width:
      min(
        300px,
        calc(100vw - 24px)
      );
  }

  .game-thumb {
    width:
      min(
        256px,
        calc(100% - 20px)
      );

    height:
      min(
        256px,
        calc(100% - 20px)
      );
  }

  .results-bar {
    align-items:
      flex-start;

    flex-direction:
      column;
  }

  #popup-box {
    padding:
      18px;
  }

  .launch-grid {
    grid-template-columns:
      1fr;
  }

  #info-popup-box {
    width:
      calc(100vw - 24px);

    max-height:
      calc(100vh - 24px);
  }

  .game-card:hover,
  .filter:hover,
  .popup-btn:hover {
    transform:
      none;
  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 420px) {

  .tabs {
    gap:
      4px;
  }

  .tab {
    padding:
      6px 7px;

    font-size:
      .7em;
  }

  .search {

.player-content {

#game-frame {

  height: 100%;

}

.notes-drawer {

.notes-drawer[hidden] {

.note-tabs,

.notes-heading {

.note-more-button {

}
.note-more-button:hover {

  box-shadow: 0 0 8px rgba(255,0,0,.28);
}
.more-notes-menu {

  top: calc(100% + 7px);
  right: 0;
  z-index: 20;
  min-width: 170px;

  max-height: 280px;
  overflow-y: auto;
  padding: 6px;

  border: 0;

  color: #eee;
  cursor: pointer;
}
.more-notes-menu button:hover,
.more-notes-menu button.active {

  color: #fff;
}
.notes-tabs-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  width: 100%;
}

.note-tabs {
  overflow-x: auto;
  overflow-y: visible;
  padding: 3px 4px 5px;
  margin: -3px -4px -5px;

  flex: 1 1 auto;
  min-width: 0;
  max-width: none;
  overflow: hidden;
  overflow-y: visible;
  white-space: nowrap;
}

.note-tab {

.navbar {

/* =========================================================

   ========================================================= */

.main {

    position: relative;

    overflow: visible;

    text-align: center;

    width: 100%;

    max-width: 1400px;

    margin:
        100px auto 0;

    padding:
        0 20px;
}

    position: absolute;

    width:

    height: 300px;

    left: 50%;

    top: 20px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(
                255,
                0,
                0,
                0.18

            transparent 68%

    animation:

        ease-in-out
        infinite;

    z-index: 0;
}

    position: relative;

    z-index: 1;

    display: inline-flex;

    align-items: center;

    letter-spacing: 1.8px;

        0 0 16px
        rgba(

            0,
            0,
            0.28

    animation:

        ease-in-out
        infinite;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #ff2222;

    box-shadow:
        0 0 10px #ff0000;

        ease-in-out
        infinite;

    position: relative;

    z-index: 1;

    margin:
        18px 0 0;

    font-size:
        clamp(
            2.6em,
            6vw,
            4.2em

    color: #ff0000;

        both;

        0 0 14px #fff,

        rgba(
            255,
            0,
            0,
            0.9
        );

        ease
        both;

            17,

/* =========================================================
   SECURITY / ESCAPING
   ========================================================= */

function escapeHTML(value) {

  return String(value).replace(
    /[&<>"']/g,

    char =>
      ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char])
  );

}


function escapeAttribute(value) {

  return String(value).replace(
    /["'\\]/g,
    "\\$&"
  );

}


function escapeJS(value) {

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}

function updateDateTime() {

  const now =
    new Date();


  const month =
    now.toLocaleString(
      "en-US",
      {
        month: "long"
      }
    );


  const day =
    now.getDate();


  const year =
    now.getFullYear();


  let hours =
    now.getHours();


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    );


  const ampm =
    hours >= 12
      ? "PM"
      : "AM";


  hours =
    hours % 12 || 12;


  document.getElementById(
    "datetime"
  ).textContent =
    `${month} ${day}, ${year} • ${hours}:${minutes}:${seconds} ${ampm}`;

}

}


function loadNotesState() {
  try {
    const raw = localStorage.getItem(getNotesStateStorageKey());

    if (raw) {
      const parsed = JSON.parse(raw);

      if (
        parsed &&
        Array.isArray(parsed.tabs) &&
        parsed.tabs.length
      ) {
        return parsed;
      }
    }
  } catch (error) {
    console.warn("SGS: Could not load notes for this game.", error);
  }

  return createDefaultNoteState();
}


function saveNotesState() {
  if (!notesState) return;
  localStorage.setItem(
    getNotesStateStorageKey(),
    JSON.stringify(notesState)
  );
}


notesState = loadNotesState();


function getActiveNote() {

  return notesState.tabs.find(tab =>
    tab.id === notesState.activeId
  );

}


function setNotesStatus(message) {

  notesStatus.textContent =
    message;

}


function renderNoteTabs() {
  noteTabs.innerHTML = notesState.tabs.map(tab => `
    <button
      class="note-tab ${
        tab.id === notesState.activeId ? "active" : ""
      }"
      type="button"
      role="tab"
      aria-selected="${tab.id === notesState.activeId}"
      data-note-id="${escapeAttribute(tab.id)}"
    >
      ${escapeHTML(tab.title || "Untitled")}
    </button>
  `).join("");

  noteTabs.querySelectorAll(".note-tab").forEach(button => {
    button.addEventListener("click", () => {
      switchNoteTab(button.dataset.noteId);
    });
  });

  requestAnimationFrame(updateNoteTabOverflow);
}


function renderActiveNote() {
  const activeNote = getActiveNote();

  if (!activeNote) {
    return;
  }

  noteTitle.value = activeNote.title || "Untitled";
  gameNotes.value =
    localStorage.getItem(noteStorageKey(activeNote.id)) || "";

  renderNoteTabs();
}


function saveActiveNoteTab(showStatus = true) {
  const activeNote = getActiveNote();

  if (!activeNote) {
    return;
  }

  try {
    localStorage.setItem(
      noteStorageKey(activeNote.id),
      gameNotes.value
    );
    saveNotesState();
  } catch (error) {
    console.warn("SGS: Could not save note content.", error);
  }

  if (showStatus) {
    setNotesStatus("Saved in this browser.");
  }
}


function toggleMoreNotes(event) {
  event.stopPropagation();

  const menu = document.getElementById("more-notes-menu");
  if (!menu) return;

  renderMoreNotes();
  menu.hidden = !menu.hidden;
}


function renderMoreNotes() {
  const menu = document.getElementById("more-notes-menu");
  if (!menu) return;

  menu.innerHTML = "";

  notesState.tabs.forEach(tab => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = tab.title || "Untitled";

    if (tab.id === notesState.activeId) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      switchNoteTab(tab.id);
      menu.hidden = true;
    });

    menu.appendChild(button);
  });
}


function updateNoteTabOverflow() {
  const tabsEl = document.getElementById("note-tabs");
  const moreButton = document.querySelector(".note-more-button");

  if (!tabsEl || !moreButton) return;

  const buttons = Array.from(tabsEl.querySelectorAll(".note-tab"));

  /* Start with everything visible and determine how many fit. */
  buttons.forEach(button => {
    button.style.display = "block";
  });

  let fits = true;

  while (
    buttons.length &&
    tabsEl.scrollWidth > tabsEl.clientWidth + 1
  ) {
    const visible = buttons.filter(button =>
      button.style.display !== "none"
    );

    if (visible.length <= 1) break;

    const last = visible[visible.length - 1];
    last.style.display = "none";
    fits = false;
  }

  moreButton.style.display =
    fits && notesState.tabs.length <= buttons.length
      ? "none"
      : "block";

  renderMoreNotes();
}


function createNoteTab() {

  saveActiveNoteTab(false);

  const id =
    makeNoteId();

  notesState.tabs.push({
    id,
    title: `Note ${notesState.tabs.length + 1}`
  });

  notesState.activeId =
    id;

  saveNotesState();

  renderActiveNote();

  noteTitle.focus();

  setNotesStatus(
    "New tab ready."
  );

}


function switchNoteTab(id) {

  if (
    !notesState.tabs.some(tab =>
      tab.id === id
    )
  ) {
    return;
  }

  saveActiveNoteTab(false);

  notesState.activeId =
    id;

  saveNotesState();

  renderActiveNote();

}


function closeActiveNoteTab() {

  const index =
    notesState.tabs.findIndex(tab =>
      tab.id === notesState.activeId
    );

  if (index < 0) {
    return;
  }

  const closedNote =
    notesState.tabs[index];

  localStorage.removeItem(noteStorageKey(closedNote.id));

  if (notesState.tabs.length === 1) {

    notesState.tabs[0] = {
      id: makeNoteId(),
      title: "Note 1"
    };

  } else {
    notesState.tabs.splice(index, 1);
  }

  notesState.activeId =
    notesState.tabs[
      Math.min(index, notesState.tabs.length - 1)
    ].id;

  saveNotesState();

  renderActiveNote();

  setNotesStatus(
    "Tab closed."
  );

}


function toggleNotesDrawer(open) {
  const shouldOpen =
    typeof open === "boolean"
      ? open
      : notesDrawer.hasAttribute("hidden");

  if (shouldOpen) {
    renderActiveNote();
    notesDrawer.removeAttribute("hidden");
    notesDrawer.style.display = "flex";
    requestAnimationFrame(updateNoteTabOverflow);
    setNotesStatus("Saved in this browser.");
    return;
  }

  try {
    saveActiveNoteTab(false);
  } finally {
    notesDrawer.setAttribute("hidden", "");
    notesDrawer.style.display = "none";

    const menu = document.getElementById("more-notes-menu");
    if (menu) menu.hidden = true;
  }
}


gameNotes.addEventListener("input", () => {
  /* Save note contents immediately on every edit. */
  saveActiveNoteTab(false);
  setNotesStatus("Saved in this browser.");
});

noteTitle.addEventListener("input", () => {
  const activeNote = getActiveNote();

  if (!activeNote) return;

  activeNote.title =
    noteTitle.value || `Note ${notesState.tabs.indexOf(activeNote) + 1}`;

  saveNotesState();

  const activeTab = noteTabs.querySelector(
    `[data-note-id="${CSS.escape(activeNote.id)}"]`
  );

  if (activeTab) {
    activeTab.textContent = activeNote.title || "Untitled";
  }

  updateNoteTabOverflow();
  setNotesStatus("Saved in this browser.");
});


function openGamePlayer(
  url,
  title,
  controls = "",
  howToPlay = "",
  sideNotes = ""
) {

  currentGameURL =
    url;

  currentGameTitle =
    title;

  /* Every game gets its own independent notebook. */
  currentNotesGameKey = url;
  notesState = loadNotesState();

  currentGameDetails = {
    controls,
    howToPlay,
    sideNotes
  };


  gamePlayerTitle.textContent =
    title;

  gameFrame.src =
    url;


  gamePlayer.classList.add(
    "open"
  );

}


function closeGamePlayer() {

  if (typeof saveActiveNoteTab === "function" && notesState) {
    saveActiveNoteTab(false);
  }

  if (notesDrawer) {
    notesDrawer.setAttribute("hidden", "");
    notesDrawer.style.display = "none";
  }

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }

  gamePlayer.classList.remove("open");

  gameFrame.src = "about:blank";

  currentGameURL = "";
  currentGameTitle = "";

}


function closeGameBackdrop(event) {

  if (event.target === gamePlayer) {

    closeGamePlayer();

  }

}


function toggleGameFullscreen() {

  if (document.fullscreenElement) {

    document.exitFullscreen();

    return;

  }

  gameFrame
    .requestFullscreen()
    .catch(error => {

      console.error(
        "SGS: Game iframe fullscreen could not be started.",
        error
      );

    });

}


/* =========================================================
   INFO POPUP
   ========================================================= */

function openInfoPopup(
  title,
  text,
  category = "Game Information"
) {

  document.getElementById(
    "info-title"
  ).textContent =
    title;


  document.getElementById(
    "info-category"
  ).textContent =
    category;


  document.getElementById(
    "info-text"
  ).textContent =
    text;


  document
    .getElementById("info-popup")
    .classList.add("open");

}


function closeInfoPopup() {

  document
    .getElementById("info-popup")
    .classList.remove("open");

}


function closeInfoBackdrop(event) {

  if (
    event.target ===
    document.getElementById(
      "info-popup"
    )
  ) {

    closeInfoPopup();

  }

}






document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    toggleNotesDrawer(false);
  }
});

/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeGamePlayer();

      closeInfoPopup();

    }

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

renderFilters();

renderGames();

window.addEventListener("resize", updateNoteTabOverflow);

document.addEventListener("click", event => {
  const menu = document.getElementById("more-notes-menu");
  const button = document.querySelector(".note-more-button");

  if (
    menu &&
    !menu.hidden &&
    !menu.contains(event.target) &&
    event.target !== button
  ) {
    menu.hidden = true;
  }
});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGS • Games</title>
  <link rel="icon" type="image/png" href="Img/SGS.png">

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

#vanta-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none !important;
  overflow: hidden;
}

.navbar,
.page {
  position: relative;
  z-index: 2;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  min-width: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at 50% 10%, rgba(255,0,0,.08), transparent 32%), #080808;
  color: #fff;
  overflow-x: hidden;
}


/* =========================================================
   NAVBAR
   ========================================================= */

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #ff0000, #660000);
  box-shadow: 0 0 20px #ff0000;
  padding: 12px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
  width: 100vw;
  max-width: 100vw;
}

.left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 1.5em;
  font-weight: bold;
}

.datetime {
  font-size: 0.95em;
  color: #ffd6d6;
  text-shadow: 0 0 10px #ff0000;
}

.center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.tabs {
  display: flex;
  gap: 10px;
}

.tab {
  display: block;
  background: #111;
  padding: 8px 16px;
  border-radius: 6px;
  transition: 0.3s ease;
  cursor: pointer;
  color: #fff;
  text-decoration: none;
}

.tab:hover {
  transform: translateY(-1px);
  background: #222;
  box-shadow: 0 0 10px #ff0000;
}

.active {
  background: #330000;
  box-shadow: 0 0 12px #ff0000;
  transform: scale(1.03);
}


/* =========================================================
   PAGE
   ========================================================= */

.page {
  width: min(1500px, calc(100% - 36px));
  max-width: 1500px;
  margin: 0 auto;
  padding: 72px clamp(18px, 4vw, 55px) 80px;
  position: relative;
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
  text-align: center;
  position: relative;
  margin-bottom: 42px;
}

.hero-glow {
  position: absolute;
  width: min(700px, 85vw);
  height: 260px;
  left: 50%;
  top: -55px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(255,0,0,.18), transparent 68%);
  filter: blur(10px);
  pointer-events: none;
  animation: pulse 4s ease-in-out infinite;
}

.hero > *:not(.hero-glow) {
  position: relative;
  z-index: 1;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #660000;
  border-radius: 999px;
  padding: 7px 13px;
  color: #ff7777;
  background: rgba(20,0,0,.8);
  font-size: .75em;
  font-weight: 800;
  letter-spacing: 2px;
  box-shadow: 0 0 16px rgba(255,0,0,.25);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff2222;
  box-shadow: 0 0 10px #ff0000;
  animation: blink 1.5s infinite;
}

.hero h1 {
  margin: 18px 0 8px;
  font-size: clamp(2.5em, 6vw, 4em);
  color: #ff1111;
  text-shadow: 0 0 20px #ff0000, 0 0 45px rgba(255,0,0,.3);
}

.hero h1 span {
  color: #fff;
  text-shadow: 0 0 14px #fff, 0 0 28px rgba(255,0,0,.8);
}


/* =========================================================
   SEARCH + FILTERS
   ========================================================= */

.controls {
  position: relative;
  z-index: 2;
  width: min(900px, 100%);
  margin: 0 auto 38px;
}

.search-wrap {
  position: relative;
}

.search {
  width: 100%;
  height: 54px;
  padding: 0 20px 0 50px;
  border: 2px solid #3a0000;
  border-radius: 12px;
  outline: none;
  background: #111;
  color: #fff;
  font-size: 1em;
  box-shadow: 0 0 18px rgba(255,0,0,.15);
  transition: .25s ease;
}

.search:focus {
  border-color: #ff0000;
  box-shadow: 0 0 22px rgba(255,0,0,.35);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #ff4444;
  pointer-events: none;
}

.filters {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 13px;
  width: 100%;
}

.filter {
  appearance: none;
  border: 1px solid #431313;
  background: #101010;
  color: #aaa;
  border-radius: 999px;
  padding: 8px 15px;
  cursor: pointer;
  font: inherit;
  font-size: .84em;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  transition: transform .2s ease, color .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
}

.filter:hover {
  color: #fff;
  border-color: #ff3333;
  background: #210000;
  transform: translateY(-2px);
  box-shadow: 0 0 14px rgba(255,0,0,.22);
}

.filter.active {
  color: #fff;
  border-color: #ff1111;
  background: linear-gradient(180deg, #3b0000, #1d0000);
  box-shadow: 0 0 16px rgba(255,0,0,.38), inset 0 0 8px rgba(255,0,0,.12);
  transform: translateY(-1px);
}


/* =========================================================
   GAME AREA
   ========================================================= */

.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
  color: #777;
  font-size: .9em;
}

.results-bar strong {
  color: #ff5555;
}

.games-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 300px));
  justify-content: center;
  align-items: start;
  gap: 34px 26px;
}

.game-card {
  width: 300px;
  max-width: 100%;
  background: linear-gradient(180deg, #151515, #0d0d0d);
  border: 2px solid #300000;
  border-radius: 14px;
  padding: 12px 0 14px;
  overflow: hidden;
  box-shadow: 0 0 15px rgba(255,0,0,.45);
  transition: .3s ease;
  animation: cardIn .55s ease both;
}

.game-card:hover {
  transform: translateY(-6px);
  border-color: #650000;
  box-shadow: 0 0 28px rgba(255,0,0,.75);
}

.game-thumb {
  width: 256px;
  height: 256px;
  margin: 0 auto;
  display: block;
  border-radius: 8px;
  background: #151515 center / cover no-repeat;
  box-shadow: 0 0 0 1px #250000, 0 0 14px rgba(255,0,0,.18);
}

.game-name {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px 16px 7px;
  font-size: 1.18em;
  font-weight: 750;
  color: #fff;
}

.game-bar {
  width: calc(100% - 20px);
  margin: 0 auto;
  display: flex;
  gap: 8px;
  padding: 7px;
  background: #090909;
  border: 2px solid #300000;
  border-radius: 10px;
}

.game-bar button {
  flex: 1;
  min-width: 0;
  border: 2px solid #ff0000;
  border-radius: 8px;
  padding: 8px 10px;
  background: #111;
  color: #fff;
  cursor: pointer;
  transition: .2s ease;
}

.game-bar button:hover {
  background: #330000;
  box-shadow: 0 0 14px #ff3333;
  transform: translateY(-1px);
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 55px 20px;
  color: #777;
  border: 1px dashed #3b1111;
  border-radius: 14px;
  width: min(700px, 100%);
}


/* =========================================================
   MODALS
   ========================================================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.84);
  justify-content: center;
  align-items: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}

.modal.open {
  display: flex;
}


/* =========================================================
   INFO POPUP - WIDE & TALL
   ========================================================= */

#info-popup-box {
  width: min(820px, 95vw);
  max-height: min(680px, calc(100vh - 40px));
  background: #0f0f0f;
  border: 2px solid #ff2222;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(255,0,0,.6), 0 0 80px rgba(255,0,0,.16);
  animation: infoIn .25s ease-out;
  display: flex;
  flex-direction: column;
}

.info-header {
  position: relative;
  min-height: 72px;
  display: flex;
  align-items: center;
  padding: 16px 54px 16px 24px;
  border-bottom: 1px solid #2b2b2b;
  background: linear-gradient(180deg, #171717, #101010);
  flex-shrink: 0;
}

.info-title {
  margin: 0;
  font-size: 1.5em;
  font-weight: 750;
  color: #fff;
  text-shadow: 0 0 10px rgba(255,0,0,.35);
}

.info-header .close {
  position: absolute;
  right: 17px;
  top: 50%;
  transform: translateY(-50%);
  color: #ff4444;
  font-size: 1.8em;
  cursor: pointer;
  transition: .2s ease;
}

.info-header .close:hover {
  color: #fff;
  text-shadow: 0 0 12px #ff0000;
}

.info-body {
  padding: 20px 24px 24px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Info tabs inside the popup */
.info-tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #2a2a2a;
  padding-bottom: 10px;
  flex-wrap: wrap;
}

.info-tab-btn {
  border: 1px solid #4c0000;
  border-radius: 8px;
  padding: 8px 16px;
  background: #090909;
  color: #aaa;
  cursor: pointer;
  font: inherit;
  font-size: .85em;
  font-weight: 600;
  transition: .2s ease;
}

.info-tab-btn:hover {
  color: #fff;
  border-color: #ff3333;
  background: #1a0000;
}

.info-tab-btn.active {
  color: #fff;
  border-color: #ff1111;
  background: #330000;
  box-shadow: 0 0 12px rgba(255,0,0,.3);
}

.info-content-area {
  flex: 1;
  min-height: 120px;
  padding: 8px 4px;
}

.info-content-area .info-label {
  display: block;
  margin-bottom: 6px;
  color: #ff4b4b;
  font-size: .75em;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.info-content-area .info-text {
  margin: 0;
  color: #ddd;
  line-height: 1.7;
  font-size: 1em;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.info-footer {
  margin-top: 8px;
  padding-top: 13px;
  border-top: 1px solid #292929;
  color: #777;
  font-size: .78em;
  flex-shrink: 0;
}


/* =========================================================
   GAME PLAYER OVERLAY
   ========================================================= */

.game-player {
  z-index: 12000 !important;
  pointer-events: auto;
  padding: clamp(8px, 2vw, 22px);
  background: rgba(0,0,0,.94);
}

#game-player-shell {
  width: 100%;
  pointer-events: auto;
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  position: relative;
  overflow: hidden;
  background: #050505;
  border: 2px solid #ff1111;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,0,0,.7);
}

.player-topbar {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 12px;
  background: linear-gradient(90deg, #250000, #111 52%, #250000);
  border-bottom: 1px solid #8b0000;
}

#game-player-title {
  overflow: hidden;
  color: #fff;
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  text-align: center;
  font-size: clamp(1rem, 2vw, 1.28rem);
}

.player-top-actions {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 7px;
}

.player-icon-button {
  border: 1px solid #a40000;
  border-radius: 7px;
  min-width: 34px;
  min-height: 34px;
  padding: 5px 8px;
  background: #111;
  color: #fff;
  cursor: pointer;
  font: inherit;
  font-size: 1.05em;
}

.player-icon-button:hover {
  background: #3a0000;
  box-shadow: 0 0 12px rgba(255,0,0,.55);
}

.player-content {
  padding: clamp(6px, 1.2vw, 14px);
  background: #060606;
  min-height: 0;
  position: relative;
}

#game-frame {
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 1px solid #510000;
  border-radius: 4px;
  background: #000;
}

/* Player footer - simplified with just game info title */
.player-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 14px;
  background: linear-gradient(90deg, #250000, #111 52%, #250000);
  border-top: 1px solid #8b0000;
  min-height: 54px;
}

.game-info-title {
  color: #ff7777;
  font-size: .9em;
  font-weight: 800;
  letter-spacing: .9px;
  text-align: center;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes pulse {
  0%, 100% { opacity: .6; transform: translateX(-50%) scale(.97); }
  50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes infoIn {
  from { opacity: 0; transform: scale(.97) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1400px) {
  .navbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: auto;
    padding: 9px 12px 10px;
  }

  .navbar .left {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px 12px;
  }

  .navbar .center {
    position: static;
    width: 100%;
    transform: none;
  }

  .navbar .tabs {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
  }

  .navbar .tab {
    padding: 7px 10px;
    font-size: .86em;
  }

  .page {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 48px clamp(14px, 4vw, 55px) 70px;
  }

  .games-grid {
    grid-template-columns: repeat(auto-fit, minmax(280px, 300px));
    justify-content: center;
    gap: 30px 18px;
  }
}

@media (max-width: 900px) {
  .navbar { gap: 7px; padding: 8px 8px 9px; }
  .navbar .left { gap: 5px 10px; }
  .navbar .tabs { gap: 4px; }
  .navbar .tab { padding: 6px 9px; font-size: .73em; }
  .page { padding: 34px 12px 60px; }
  .hero h1 { font-size: clamp(2.05rem, 7vw, 3.1rem); }
  .hero p { width: min(100%, 700px); font-size: .94em; }
  .controls { width: min(100%, 760px); }
  .games-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 300px)); justify-content: center; gap: 24px 14px; }
  .game-card { width: min(300px, 100%); }
}

@media (max-width: 600px) {
  .navbar .left { flex-direction: column; gap: 2px; }
  .navbar .logo { font-size: 1.2em; }
  .navbar .datetime { font-size: .68em; }
  .navbar .tabs { gap: 4px; }
  .navbar .tab { padding: 6px 7px; font-size: .68em; }
  .page { padding: 28px 10px 50px; }
  .hero h1 { font-size: clamp(1.9rem, 10vw, 2.65rem); }
  .hero p { font-size: .9em; line-height: 1.5; }
  .search { height: 50px; padding-left: 44px; }
  .filters { gap: 6px; }
  .filter { padding: 7px 10px; }
  .games-grid { grid-template-columns: 1fr; gap: 22px; }
  .game-card { width: min(300px, calc(100vw - 24px)); }
  .game-thumb { width: min(256px, calc(100% - 20px)); height: min(256px, calc(100% - 20px)); }
  .results-bar { align-items: flex-start; flex-direction: column; }

  #info-popup-box {
    width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
  }

  .info-title { font-size: 1.2em; }
  .info-body { padding: 14px 16px 18px; }
  .info-tab-btn { padding: 6px 12px; font-size: .78em; }
  .player-topbar { gap: 7px; padding: 6px 8px; }
  #game-player-title { display: none; }
  .player-top-actions { width: 100%; justify-content: space-between; }
  .player-footer { min-height: 44px; padding: 8px 12px; }
  .game-info-title { font-size: .78em; }
}

@media (max-width: 420px) {
  .tabs { gap: 4px; }
  .tab { padding: 6px 7px; font-size: .7em; }
  .search { height: 50px; font-size: .9em; }
  .game-card { width: min(300px, calc(100vw - 24px)); }
}

@media (hover: none) {
  .game-card:hover, .popup-btn:hover, .filter:hover { transform: none; }
}

@media (min-width: 1401px) {
  .navbar .left {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .navbar .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
  }
  .navbar .tabs { flex-wrap: nowrap; }
  .page { width: min(1500px, calc(100% - 36px)); margin: 0 auto; }
}

/* =========================================================
   GAME DATA ERROR
   ========================================================= */

.games-empty-message {
  grid-column: 1 / -1;
  width: 100%;
  min-height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.games-grid .games-empty-message {
  grid-column: 1 / -1;
  width: 100%;
  min-height: 360px;
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: 0 auto;
  padding: 40px 20px;
  box-sizing: border-box;
}

.games-grid .games-empty-message span {
  display: block;
  margin-top: 6px;
  color: #888;
}

/* SGS interaction safety layer */
#vanta-bg,
#vanta-bg canvas {
  pointer-events: none !important;
}

.navbar,
.page,
.modal,
#game-player-shell,
button,
input,
textarea,
iframe {
  pointer-events: auto;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
</head>

<body>

<div id="vanta-bg" aria-hidden="true"></div>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<div class="navbar">
    <div class="left">
        <div class="logo">Secret Game Site</div>
        <div class="datetime" id="datetime">Loading...</div>
    </div>
    <div class="center">
        <div class="tabs">
            <a class="tab" href="index.html">Home</a>
            <a class="tab active" href="games.html">Games</a>
            <a class="tab" href="utilities.html">Utilities</a>
            <a class="tab" href="browser.html">Browser</a>
            <a class="tab" href="music.html">Music Player</a>
            <a class="tab" href="forums.html">Forums</a>
            <a class="tab" href="settings.html">Settings</a>
        </div>
    </div>
</div>


<!-- =======================================================
     MAIN PAGE
     ======================================================= -->

<main class="page">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="badge">
      <span class="dot"></span>
      SGS • GAME LIBRARY
    </div>
    <h1>Game <span>Vault</span></h1>
  </section>

  <!-- SEARCH + FILTERS -->
  <section class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input
        id="game-search"
        class="search"
        type="search"
        placeholder="Search games..."
        autocomplete="off"
        aria-label="Search games"
      >
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <!-- RESULTS -->
  <div class="results-bar">
    <div><strong id="game-count">0</strong> games available</div>
    <div id="active-filter">All Games</div>
  </div>

  <!-- GAME GRID -->
  <section class="games-grid" id="games-grid"></section>

</main>


<!-- =======================================================
     INFO POPUP - WIDE & TALL
     ======================================================= -->

<div
  id="info-popup"
  class="modal"
  onclick="closeInfoBackdrop(event)"
>

  <div
    id="info-popup-box"
    onclick="event.stopPropagation()"
  >

    <div class="info-header">
      <div class="close" onclick="closeInfoPopup()">✕</div>
      <div class="info-title" id="info-title">Game</div>
    </div>

    <div class="info-body">

      <!-- Info tabs -->
      <div class="info-tabs" id="info-tabs">
        <button class="info-tab-btn active" data-tab="description" onclick="switchInfoTab('description')">📖 Description</button>
        <button class="info-tab-btn" data-tab="controls" onclick="switchInfoTab('controls')">🎮 Controls</button>
        <button class="info-tab-btn" data-tab="howToPlay" onclick="switchInfoTab('howToPlay')">❔ How to Play</button>
        <button class="info-tab-btn" data-tab="sideNotes" onclick="switchInfoTab('sideNotes')">❗ Side Notes</button>
      </div>

      <!-- Content area -->
      <div class="info-content-area">
        <span class="info-label" id="info-category">Description</span>
        <p class="info-text" id="info-text">Select a game to see its information.</p>
      </div>

      <div class="info-footer">
        Game details — all information is stored locally.
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     GAME PLAYER
     ======================================================= -->

<div
  id="game-player"
  class="modal game-player"
  onclick="closeGameBackdrop(event)"
>

  <section
    id="game-player-shell"
    role="dialog"
    aria-modal="true"
    aria-labelledby="game-player-title"
    onclick="event.stopPropagation()"
  >

    <header class="player-topbar">
      <button
        class="player-icon-button"
        type="button"
        onclick="closeGamePlayer()"
        aria-label="Back to games"
      >‹</button>
      <div id="game-player-title">Game</div>
      <div class="player-top-actions">
        <button
          class="player-icon-button"
          type="button"
          onclick="toggleGameFullscreen()"
          aria-label="Fullscreen"
        >⛶</button>
        <button
          class="player-icon-button"
          type="button"
          onclick="alert('Notes feature coming soon!')"
          aria-label="Notes"
        >📝</button>
      </div>
    </header>

    <div class="player-content">
      <iframe
        id="game-frame"
        title="Game player"
        allow="fullscreen"
        allowfullscreen
      ></iframe>
    </div>

    <!-- Simplified footer - just the game info title, no buttons -->
    <footer class="player-footer">
      <div id="player-game-info-title" class="game-info-title">
        Game Information
      </div>
    </footer>

  </section>

</div>


<script>

/* =========================================================
   GAME DATA
   ========================================================= */

let games = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const grid = document.getElementById("games-grid");
const search = document.getElementById("game-search");
const filters = document.getElementById("filters");
const gameCount = document.getElementById("game-count");
const activeFilterText = document.getElementById("active-filter");
let selectedCategory = "All";

let currentGameURL = "";
let currentGameTitle = "";
let currentGameDetails = {
  description: "",
  controls: "",
  howToPlay: "",
  sideNotes: ""
};

const gamePlayer = document.getElementById("game-player");
const gameFrame = document.getElementById("game-frame");
const gamePlayerTitle = document.getElementById("game-player-title");

// Info popup elements
const infoPopup = document.getElementById("info-popup");
const infoTitle = document.getElementById("info-title");
const infoCategory = document.getElementById("info-category");
const infoText = document.getElementById("info-text");
const infoTabs = document.getElementById("info-tabs");
let currentInfoData = {
  title: "",
  description: "",
  controls: "",
  howToPlay: "",
  sideNotes: ""
};
let currentInfoTab = "description";


/* =========================================================
   CATEGORIES
   ========================================================= */

const categories = [];


/* =========================================================
   LOAD GAME DATA
   ========================================================= */

async function loadGameData() {
  try {
    const response = await fetch("./GD.html", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("GD.html returned HTTP " + response.status);
    }

    const source = await response.text();

    const match = source.match(
      /<script\b[^>]*\bid=["']sgs-game-data["'][^>]*>([\s\S]*?)<\/script>/i
    );

    if (!match) {
      throw new Error("Could not find #sgs-game-data in GD.html");
    }

    const data = JSON.parse(match[1].trim());

    if (!data || !Array.isArray(data.games)) {
      throw new Error("GD.html contains no valid games array");
    }

    games = data.games.filter(game =>
      game &&
      typeof game.name === "string" &&
      typeof game.url === "string" &&
      typeof game.image === "string" &&
      typeof game.category === "string"
    );

    // Shuffle
    for (let i = games.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [games[i], games[j]] = [games[j], games[i]];
    }

    if (!games.length) {
      throw new Error("GD.html loaded successfully, but contains zero games");
    }

    categories.length = 0;
    categories.push("All", ...new Set(games.map(game => game.category)));

    renderFilters();
    renderGames();

  } catch (error) {
    console.error("SGS GD.html loader:", error);

    gameCount.textContent = "0";
    activeFilterText.textContent = "All Games";

    grid.innerHTML = `
      <div class="empty games-empty-message">
        <div style="font-size:2em;margin-bottom:8px;">⚠</div>
        <strong>Game data could not be loaded.</strong><br>
        <span style="font-size:.9em;">
          Make sure GD.html is in the same folder as this page.
        </span>
      </div>
    `;
  }
}


/* =========================================================
   RENDER FILTERS
   ========================================================= */

function renderFilters() {
  filters.innerHTML = categories.map(category => `
    <button
      type="button"
      class="filter ${category === selectedCategory ? "active" : ""}"
      data-category="${escapeHTML(category)}"
      aria-pressed="${category === selectedCategory}"
    >
      ${category === "All" ? "All Games" : escapeHTML(category)}
    </button>
  `).join("");

  filters.querySelectorAll(".filter").forEach(button => {
    button.addEventListener("click", function(event) {
      event.preventDefault();
      event.stopPropagation();
      setCategory(this.dataset.category);
    });
  });
}


/* =========================================================
   SET CATEGORY
   ========================================================= */

function setCategory(category) {
  if (!categories.includes(category)) {
    category = "All";
  }

  selectedCategory = category;

  document.querySelectorAll(".filter").forEach(button => {
    const isActive = button.dataset.category === selectedCategory;
    button.classList.toggle("active", isActive);
    button.setAttribute("aria-pressed", String(isActive));
  });

  renderGames();
}


/* =========================================================
   RENDER GAMES
   ========================================================= */

function renderGames() {
  const term = search.value.trim().toLowerCase();

  const visibleGames = games.filter(game => {
    const categoryMatch = selectedCategory === "All" || game.category === selectedCategory;
    const searchMatch = !term ||
      String(game.name || "").toLowerCase().includes(term) ||
      String(game.category || "").toLowerCase().includes(term) ||
      String(game.description || "").toLowerCase().includes(term);
    return categoryMatch && searchMatch;
  });

  gameCount.textContent = visibleGames.length;
  activeFilterText.textContent = selectedCategory === "All" ? "All Games" : selectedCategory;

  grid.innerHTML = "";

  if (!visibleGames.length) {
    const empty = document.createElement("div");
    empty.className = "games-empty-message";
    empty.innerHTML =
      '<div style="font-size:2em;margin-bottom:8px;">🔎</div>' +
      '<strong>No games found.</strong>' +
      '<span>Try another search or category.</span>';
    grid.appendChild(empty);
    return;
  }

  visibleGames.forEach((game, index) => {
    const card = document.createElement("article");
    card.className = "game-card";
    card.style.animationDelay = Math.min(index * 45, 400) + "ms";

    const thumb = document.createElement("div");
    thumb.className = "game-thumb";
    thumb.setAttribute("role", "img");
    thumb.setAttribute("aria-label", String(game.name || ""));
    if (game.image) {
      thumb.style.backgroundImage = 'url("' + String(game.image).replace(/"/g, '\\"') + '")';
    }

    const name = document.createElement("div");
    name.className = "game-name";
    name.textContent = String(game.name || "Unnamed Game");

    const bar = document.createElement("div");
    bar.className = "game-bar";

    const play = document.createElement("button");
    play.type = "button";
    play.textContent = "▶ Play";
    play.addEventListener("click", () => {
      openGamePlayer(
        String(game.url || ""),
        String(game.name || ""),
        String(game.controls || ""),
        String(game.howToPlay || ""),
        String(game.sideNotes || ""),
        String(game.description || "")
      );
    });

    const info = document.createElement("button");
    info.type = "button";
    info.textContent = "ℹ Info";
    info.addEventListener("click", () => {
      openInfoPopup(
        String(game.name || ""),
        String(game.description || ""),
        String(game.controls || ""),
        String(game.howToPlay || ""),
        String(game.sideNotes || ""),
        String(game.category || "")
      );
    });

    bar.appendChild(play);
    bar.appendChild(info);

    card.appendChild(thumb);
    card.appendChild(name);
    card.appendChild(bar);

    grid.appendChild(card);
  });
}


/* =========================================================
   INFO POPUP - WIDE & TALL
   ========================================================= */

function openInfoPopup(title, description, controls, howToPlay, sideNotes, category) {
  currentInfoData = {
    title: title || "Game",
    description: description || "No description available.",
    controls: controls || "No controls information available.",
    howToPlay: howToPlay || "No gameplay instructions available.",
    sideNotes: sideNotes || "No additional notes available."
  };

  currentInfoTab = "description";

  infoTitle.textContent = currentInfoData.title;

  // Update tab buttons
  document.querySelectorAll(".info-tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === "description");
  });

  // Show description by default
  infoCategory.textContent = "Description";
  infoText.textContent = currentInfoData.description;

  infoPopup.classList.add("open");
}


function switchInfoTab(tab) {
  if (!currentInfoData.title) return;

  currentInfoTab = tab;

  // Update tab buttons
  document.querySelectorAll(".info-tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });

  // Update content
  const tabLabels = {
    description: "Description",
    controls: "Controls",
    howToPlay: "How to Play",
    sideNotes: "Side Notes"
  };

  const tabContent = {
    description: currentInfoData.description,
    controls: currentInfoData.controls,
    howToPlay: currentInfoData.howToPlay,
    sideNotes: currentInfoData.sideNotes
  };

  infoCategory.textContent = tabLabels[tab] || "Information";
  infoText.textContent = tabContent[tab] || "No information available.";
}


function closeInfoPopup() {
  infoPopup.classList.remove("open");
}


function closeInfoBackdrop(event) {
  if (event.target === infoPopup) {
    closeInfoPopup();
  }
}


/* =========================================================
   GAME PLAYER
   ========================================================= */

function openGamePlayer(url, title, controls, howToPlay, sideNotes, description) {
  currentGameURL = url;
  currentGameTitle = title;

  currentGameDetails = {
    description: description || "",
    controls: controls || "",
    howToPlay: howToPlay || "",
    sideNotes: sideNotes || ""
  };

  gamePlayerTitle.textContent = title;
  gameFrame.src = url;
  gamePlayer.classList.add("open");
}


function closeGamePlayer() {
  gamePlayer.classList.remove("open");
  gameFrame.src = "about:blank";
  currentGameURL = "";
  currentGameTitle = "";
}


function closeGameBackdrop(event) {
  if (event.target === gamePlayer) {
    closeGamePlayer();
  }
}


function toggleGameFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
    return;
  }
  gameFrame.requestFullscreen().catch(error => {
    console.error("SGS: Game iframe fullscreen could not be started.", error);
  });
}


/* =========================================================
   SECURITY / ESCAPING
   ========================================================= */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])
  );
}


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener("input", renderGames);


/* =========================================================
   DATE / TIME
   ========================================================= */

function updateDateTime() {
  const now = new Date();
  const month = now.toLocaleString("en-US", { month: "long" });
  const day = now.getDate();
  const year = now.getFullYear();
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  document.getElementById("datetime").textContent =
    `${month} ${day}, ${year} • ${hours}:${minutes}:${seconds} ${ampm}`;
}

setInterval(updateDateTime, 1000);
updateDateTime();


/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeGamePlayer();
    closeInfoPopup();
  }
});


/* =========================================================
   VAUNT INIT
   ========================================================= */

(function () {
  function initSGSVanta() {
    if (!window.VANTA || !window.VANTA.FOG) return;
    window.SGS_VANTA = window.VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x0,
      lowlightColor: 0x5f0000,
      baseColor: 0x0,
      blurFactor: 0.51,
      speed: 0.50,
      zoom: 0.70
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSGSVanta, { once: true });
  } else {
    initSGSVanta();
  }
})();


/* =========================================================
   INIT
   ========================================================= */

loadGameData();

</script>

</body>
</html>

const noteTabs = document.getElementById("note-tabs");
const noteTitle = document.getElementById("note-title");
const gameNotes = document.getElementById("game-notes");
const notesStatus = document.querySelector(".notes-status");

const categories = [];

const NOTES_STATE_STORAGE_PREFIX = "sgsNotesState:";
const NOTES_CONTENT_STORAGE_PREFIX = "sgsNoteContent:";

let notesState;
let currentNotesGameKey = "";

function makeNoteId() {
  return `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
}

function getNotesGameKey() {
  return currentGameURL || "sgs-home";
}

function getNotesStateStorageKey() {
  return NOTES_STATE_STORAGE_PREFIX + encodeURIComponent(getNotesGameKey());
}

function noteStorageKey(id) {
  return NOTES_CONTENT_STORAGE_PREFIX + encodeURIComponent(getNotesGameKey()) + ":" + id;
}

function createDefaultNoteState() {
  const id = makeNoteId();

  return {
    activeId: id,
    tabs: [{ id, title: "Note 1" }]
  };
}

function loadNotesState() {

  try {

    const raw =
      localStorage.getItem(
        getNotesStateStorageKey()
      );

    if (raw) {

      const parsed =
        JSON.parse(raw);

      if (
        parsed &&
        Array.isArray(parsed.tabs) &&
        parsed.tabs.length
      ) {
        return parsed;
      }
    }

  } catch (error) {
    console.warn(
      "SGS: Could not load notes for this game.",
      error
    );
  }

  return createDefaultNoteState();
}

function saveNotesState() {

  if (!notesState) return;

  localStorage.setItem(
    getNotesStateStorageKey(),
    JSON.stringify(notesState)
  );
}

function getActiveNote() {
  return notesState.tabs.find(
    tab => tab.id === notesState.activeId
  );
}

function setNotesStatus(message) {
  notesStatus.textContent = message;
}

function renderNoteTabs() {

  noteTabs.innerHTML =
    notesState.tabs.map(tab => `
    <button
      class="note-tab ${tab.id === notesState.activeId ? "active" : ""}"
      type="button"
      role="tab"
      aria-selected="${tab.id === notesState.activeId}"
      data-note-id="${tab.id}"
    >
      ${escapeHTML(tab.title || "Untitled")}
    </button>
  `).join("");

  noteTabs
    .querySelectorAll(".note-tab")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          switchNoteTab(
            button.dataset.noteId
          );
        }
      );

    });

  requestAnimationFrame(
    updateNoteTabOverflow
  );
}

function renderActiveNote() {

  const activeNote =
    getActiveNote();

  if (!activeNote) return;

  noteTitle.value =
    activeNote.title || "Untitled";

  gameNotes.value =
    localStorage.getItem(
      noteStorageKey(activeNote.id)
    ) || "";

  renderNoteTabs();
}

function saveActiveNoteTab(showStatus = true) {

  const activeNote =
    getActiveNote();

  if (!activeNote) return;

  try {

    localStorage.setItem(
      noteStorageKey(activeNote.id),
      gameNotes.value
    );

    saveNotesState();

  } catch (error) {

    console.warn(
      "SGS: Could not save note content.",
      error
    );
  }

  if (showStatus) {
    setNotesStatus(
      "Saved in this browser."
    );
  }
}

function toggleMoreNotes(event) {

  event.stopPropagation();

  const menu =
    document.getElementById(
      "more-notes-menu"
    );

  if (!menu) return;

  renderMoreNotes();

  menu.hidden = !menu.hidden;
}

function renderMoreNotes() {

  const menu =
    document.getElementById(
      "more-notes-menu"
    );

  if (!menu) return;

  menu.innerHTML = "";

  notesState.tabs.forEach(tab => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent =
      tab.title || "Untitled";

    if (
      tab.id ===
      notesState.activeId
    ) {
      button.classList.add("active");
    }

    button.addEventListener(
      "click",
      () => {

        switchNoteTab(tab.id);

        menu.hidden = true;
      }
    );

    menu.appendChild(button);
  });
}

function updateNoteTabOverflow() {

  const tabsEl =
    document.getElementById(
      "note-tabs"
    );

  const moreButton =
    document.querySelector(
      ".note-more-button"
    );

  if (!tabsEl || !moreButton) return;

  const buttons =
    Array.from(
      tabsEl.querySelectorAll(
        ".note-tab"
      )
    );

  buttons.forEach(button => {
    button.style.display = "block";
  });

  let fits = true;

  while (
    buttons.length &&
    tabsEl.scrollWidth >
      tabsEl.clientWidth + 1
  ) {

    const visible =
      buttons.filter(
        button =>
          button.style.display !==
          "none"
      );

    if (visible.length <= 1) break;

    const last =
      visible[visible.length - 1];

    last.style.display = "none";

    fits = false;
  }

  moreButton.style.display =
    fits &&
    notesState.tabs.length <= buttons.length
      ? "none"
      : "block";

  renderMoreNotes();
}

function createNoteTab() {

  saveActiveNoteTab(false);

  const id =
    makeNoteId();

  notesState.tabs.push({
    id,
    title:
      `Note ${notesState.tabs.length + 1}`
  });

  notesState.activeId = id;

  saveNotesState();

  renderActiveNote();

  noteTitle.focus();

  setNotesStatus(
    "New tab ready."
  );
}

function switchNoteTab(id) {

  if (
    !notesState.tabs.some(
      tab => tab.id === id
    )
  ) {
    return;
  }

  saveActiveNoteTab(false);

  notesState.activeId = id;

  saveNotesState();

  renderActiveNote();
}

function closeActiveNoteTab() {

  const index =
    notesState.tabs.findIndex(
      tab =>
        tab.id ===
        notesState.activeId
    );

  if (index < 0) return;

  const closedNote =
    notesState.tabs[index];

  localStorage.removeItem(
    noteStorageKey(closedNote.id)
  );

  if (
    notesState.tabs.length === 1
  ) {

    notesState.tabs[0] = {
      id: makeNoteId(),
      title: "Note 1"
    };

  } else {

    notesState.tabs.splice(
      index,
      1
    );
  }

  notesState.activeId =
    notesState.tabs[
      Math.min(
        index,
        notesState.tabs.length - 1
      )
    ].id;

  saveNotesState();

  renderActiveNote();

  setNotesStatus(
    "Tab closed."
  );
}

function toggleNotesDrawer(open) {

  const shouldOpen =
    typeof open === "boolean"
      ? open
      : notesModal.hasAttribute(
          "hidden"
        );

  if (shouldOpen) {

    notesModalTitle.textContent =
      currentGameTitle || "Notes";

    renderActiveNote();

    notesModal.removeAttribute(
      "hidden"
    );

    notesModal.style.display =
      "flex";

    requestAnimationFrame(
      updateNoteTabOverflow
    );

    setNotesStatus(
      "Saved in this browser."
    );

    return;
  }

  try {

    saveActiveNoteTab(false);

  } finally {

    notesModal.setAttribute(
      "hidden",
      ""
    );

    notesModal.style.display =
      "none";

    const menu =
      document.getElementById(
        "more-notes-menu"
      );

    if (menu) {
      menu.hidden = true;
    }
  }
}

function closeNotesBackdrop(event) {

  if (
    event.target ===
    notesModal
  ) {
    toggleNotesDrawer(false);
  }
}

gameNotes.addEventListener(
  "input",
  () => {

    saveActiveNoteTab(false);

    setNotesStatus(
      "Saved in this browser."
    );
  }
);

noteTitle.addEventListener(
  "input",
  () => {

    const activeNote =
      getActiveNote();

    if (!activeNote) return;

    activeNote.title =
      noteTitle.value ||
      `Note ${
        notesState.tabs.indexOf(
          activeNote
        ) + 1
      }`;

    saveNotesState();

    const activeTab =
      noteTabs.querySelector(
        `[data-note-id="${activeNote.id}"]`
      );

    if (activeTab) {

      activeTab.textContent =
        activeNote.title ||
        "Untitled";
    }

    updateNoteTabOverflow();

    setNotesStatus(
      "Saved in this browser."
    );
  }
);

document.addEventListener(
  "click",
  event => {

    const menu =
      document.getElementById(
        "more-notes-menu"
      );

    const button =
      document.querySelector(
        ".note-more-button"
      );

    if (
      menu &&
      !menu.hidden &&
      !menu.contains(event.target) &&
      event.target !== button
    ) {
      menu.hidden = true;
    }
  }
);

window.addEventListener(
  "resize",
  updateNoteTabOverflow
);

async function loadGameData() {

  try {

    const response =
      await fetch(
        "./GD.html",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "GD.html returned HTTP " +
        response.status
      );
    }

    const source =
      await response.text();

    const match =
      source.match(
        /<script\b[^>]*\bid=["']sgs-game-data["'][^>]*>([\s\S]*?)<\/script>/i
      );

    if (!match) {

      throw new Error(
        "Could not find #sgs-game-data in GD.html"
      );
    }

    const data =
      JSON.parse(
        match[1].trim()
      );

    if (
      !data ||
      !Array.isArray(data.games)
    ) {

      throw new Error(
        "GD.html contains no valid games array"
      );
    }

    games =
      data.games.filter(
        game =>
          game &&
          typeof game.name === "string" &&
          typeof game.url === "string" &&
          typeof game.image === "string" &&
          typeof game.category === "string"
      );

    for (
      let i = games.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() *
          (i + 1)
        );

      [games[i], games[j]] =
        [games[j], games[i]];
    }

    if (!games.length) {

      throw new Error(
        "GD.html loaded successfully, but contains zero games"
      );
    }

    categories.length = 0;

    categories.push(
      "All",
      ...new Set(
        games.map(
          game => game.category
        )
      )
    );

    renderFilters();
    renderGames();

  } catch (error) {

    console.error(
      "SGS GD.html loader:",
      error
    );

    gameCount.textContent = "0";

    activeFilterText.textContent =
      "All Games";

    grid.innerHTML = `
      <div class="empty games-empty-message">
        <div style="font-size:2em;margin-bottom:8px;">⚠</div>
        <strong>Game data could not be loaded.</strong><br>
        <span style="font-size:.9em;">
          Make sure GD.html is in the same folder as this page.
        </span>
      </div>
    `;
  }
}

function renderFilters() {

  filters.innerHTML =
    categories.map(
      category => `
    <button
      type="button"
      class="filter ${category === selectedCategory ? "active" : ""}"
      data-category="${escapeHTML(category)}"
      aria-pressed="${category === selectedCategory}"
    >
      ${category === "All"
        ? "All Games"
        : escapeHTML(category)}
    </button>
  `
    ).join("");

  filters
    .querySelectorAll(".filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          event.stopPropagation();

          setCategory(
            this.dataset.category
          );
        }
      );
    });
}

function setCategory(category) {

  if (
    !categories.includes(category)
  ) {
    category = "All";
  }

  selectedCategory = category;

  document
    .querySelectorAll(".filter")
    .forEach(button => {

      const isActive =
        button.dataset.category ===
        selectedCategory;

      button.classList.toggle(
        "active",
        isActive
      );

      button.setAttribute(
        "aria-pressed",
        String(isActive)
      );
    });

  renderGames();
}

function renderGames() {

  const term =
    search.value
      .trim()
      .toLowerCase();

  const visibleGames =
    games.filter(game => {

      const categoryMatch =
        selectedCategory === "All" ||
        game.category ===
          selectedCategory;

      const searchMatch =
        !term ||
        String(
          game.name || ""
        )
          .toLowerCase()
          .includes(term) ||
        String(
          game.category || ""
        )
          .toLowerCase()
          .includes(term) ||
        String(
          game.description || ""
        )
          .toLowerCase()
          .includes(term);

      return (
        categoryMatch &&
        searchMatch
      );
    });

  gameCount.textContent =
    visibleGames.length;

  activeFilterText.textContent =
    selectedCategory === "All"
      ? "All Games"
      : selectedCategory;

  grid.innerHTML = "";

  if (!visibleGames.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "games-empty-message";

    empty.innerHTML =
      '<div style="font-size:2em;margin-bottom:8px;">🔎</div>' +
      '<strong>No games found.</strong>' +
      '<span>Try another search or category.</span>';

    grid.appendChild(empty);

    return;
  }

  visibleGames.forEach(
    (game, index) => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "game-card";

      card.style.animationDelay =
        Math.min(
          index * 45,
          400
        ) + "ms";

      const thumb =
        document.createElement(
          "div"
        );

      thumb.className =
        "game-thumb";

      thumb.setAttribute(
        "role",
        "img"
      );

      thumb.setAttribute(
        "aria-label",
        String(
          game.name || ""
        )
      );

      if (game.image) {

        thumb.style.backgroundImage =
          'url("' +
          String(game.image)
            .replace(
              /"/g,
              '\\"'
            ) +
          '")';
      }

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "game-name";

      name.textContent =
        String(
          game.name ||
          "Unnamed Game"
        );

      const bar =
        document.createElement(
          "div"
        );

      bar.className =
        "game-bar";

      const play =
        document.createElement(
          "button"
        );

      play.type = "button";

      play.textContent =
        "▶ Play";

      play.addEventListener(
        "click",
        () => {

          openGamePlayer(
            String(game.url || ""),
            String(game.name || ""),
            String(game.controls || ""),
            String(game.howToPlay || ""),
            String(game.sideNotes || ""),
            String(game.description || "")
          );
        }
      );

      const info =
        document.createElement(
          "button"
        );

      info.type = "button";

      info.textContent =
        "ℹ Info";

      info.addEventListener(
        "click",
        () => {

          openInfoPopup(
            String(game.name || ""),
            String(game.description || ""),
            String(game.controls || ""),
            String(game.howToPlay || ""),
            String(game.sideNotes || ""),
            String(game.category || "")
          );
        }
      );

      bar.appendChild(play);
      bar.appendChild(info);

      card.appendChild(thumb);
      card.appendChild(name);
      card.appendChild(bar);

      grid.appendChild(card);
    }
  );
}

function openInfoPopup(
  title,
  description,
  controls,
  howToPlay,
  sideNotes,
  category
) {

  currentInfoData = {
    title:
      title || "Game",
    description:
      description ||
      "No description available.",
    controls:
      controls ||
      "No controls information available.",
    howToPlay:
      howToPlay ||
      "No gameplay instructions available.",
    sideNotes:
      sideNotes ||
      "No additional notes available."
  };

  currentInfoTab =
    "description";

  infoTitle.textContent =
    currentInfoData.title;

  document
    .querySelectorAll(
      ".info-tab-btn"
    )
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.tab ===
          "description"
      );
    });

  infoCategory.textContent =
    "Description";

  infoText.textContent =
    currentInfoData.description;

  infoPopup.classList.add(
    "open"
  );
}

function switchInfoTab(tab) {

  if (!currentInfoData.title)
    return;

  currentInfoTab = tab;

  document
    .querySelectorAll(
      ".info-tab-btn"
    )
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.tab === tab
      );
    });

  const tabLabels = {
    description:
      "Description",
    controls:
      "Controls",
    howToPlay:
      "How to Play",
    sideNotes:
      "Side Notes"
  };

  const tabContent = {
    description:
      currentInfoData.description,
    controls:
      currentInfoData.controls,
    howToPlay:
      currentInfoData.howToPlay,
    sideNotes:
      currentInfoData.sideNotes
  };

  infoCategory.textContent =
    tabLabels[tab] ||
    "Information";

  infoText.textContent =
    tabContent[tab] ||
    "No information available.";
}

function closeInfoPopup() {
  infoPopup.classList.remove(
    "open"
  );
}

function closeInfoBackdrop(event) {

  if (
    event.target ===
    infoPopup
  ) {
    closeInfoPopup();
  }
}

function openGamePlayer(
  url,
  title,
  controls,
  howToPlay,
  sideNotes,
  description
) {

  currentGameURL = url;

  currentGameTitle = title;

  currentGameDetails = {
    description:
      description || "",
    controls:
      controls || "",
    howToPlay:
      howToPlay || "",
    sideNotes:
      sideNotes || ""
  };

  currentNotesGameKey =
    url;

  notesState =
    loadNotesState();

  gamePlayerTitle.textContent =
    title;

  gameFrame.src =
    url;

  gamePlayer.classList.add(
    "open"
  );
}

function closeGamePlayer() {

  if (
    typeof saveActiveNoteTab ===
      "function" &&
    notesState
  ) {

    saveActiveNoteTab(false);
  }

  if (notesModal) {

    notesModal.setAttribute(
      "hidden",
      ""
    );

    notesModal.style.display =
      "none";

    const menu =
      document.getElementById(
        "more-notes-menu"
      );

    if (menu) {
      menu.hidden = true;
    }
  }

  if (
    document.fullscreenElement
  ) {

    document
      .exitFullscreen()
      .catch(() => {});
  }

  gamePlayer.classList.remove(
    "open"
  );

  gameFrame.src =
    "about:blank";

  currentGameURL = "";

  currentGameTitle = "";
}

function closeGameBackdrop(event) {

  if (
    event.target ===
    gamePlayer
  ) {
    closeGamePlayer();
  }
}

function toggleGameFullscreen() {

  if (
    document.fullscreenElement
  ) {

    document.exitFullscreen();

    return;
  }

  gameFrame
    .requestFullscreen()
    .catch(error => {

      console.error(
        "SGS: Game iframe fullscreen could not be started.",
        error
      );
    });
}

function escapeHTML(value) {

  return String(value).replace(
    /[&<>"']/g,
    char =>
      ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char])
  );
}

search.addEventListener(
  "input",
  renderGames
);

function updateDateTime() {

  const now =
    new Date();

  const month =
    now.toLocaleString(
      "en-US",
      {
        month: "long"
      }
    );

  const day =
    now.getDate();

  const year =
    now.getFullYear();

  let hours =
    now.getHours();

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2, "0");

  const seconds =
    String(
      now.getSeconds()
    ).padStart(2, "0");

  const ampm =
    hours >= 12
      ? "PM"
      : "AM";

  hours =
    hours % 12 || 12;

  document.getElementById(
    "datetime"
  ).textContent =
    `${month} ${day}, ${year} • ${hours}:${minutes}:${seconds} ${ampm}`;
}

setInterval(
  updateDateTime,
  1000
);

updateDateTime();

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {

      closeGamePlayer();

      closeInfoPopup();

      toggleNotesDrawer(false);
    }
  }
);

loadGameData();

</script>

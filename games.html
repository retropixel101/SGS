<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGS • Games</title>

<link rel="icon" type="image/png" href="Img/SGS.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  min-width: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 10%, rgba(255,0,0,.08), transparent 32%),
    #080808;
  color: #fff;
  overflow-x: hidden;
}

/* =========================================================
   NAVBAR
   ========================================================= */

.navbar {
  min-height: 58px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #ff0000, #660000);
  box-shadow: 0 0 20px #ff0000;
  padding: 9px 18px;

  /* NORMAL PAGE POSITION — DOES NOT FOLLOW SCREEN */
  position: relative;
  top: auto;
  z-index: 6000;
}

.left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.logo {
  font-size: 1.5em;
  font-weight: 800;
  white-space: nowrap;
}

.datetime {
  font-size: .9em;
  color: #ffd6d6;
  text-shadow: 0 0 10px #ff0000;
  white-space: nowrap;
}

.center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.tabs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-wrap: nowrap;
}

.tab {
  flex: 0 0 auto;
  background: #111;
  padding: 8px 13px;
  border-radius: 6px;
  transition: .25s ease;
  cursor: pointer;
  white-space: nowrap;
  font-size: .9em;
}

.tab:hover {
  transform: translateY(-1px);
  background: #222;
  box-shadow: 0 0 10px #ff0000;
}

.tab.active {
  background: #330000;
  box-shadow: 0 0 12px #ff0000;
}

/* =========================================================
   AD
   ========================================================= */

.site-ad-left {
  position: fixed;
  left: 0;
  top: max(58px, calc(58px + (100vh - 683px) / 2));
  width: 160px;
  height: 625px;
  margin: 0;
  padding: 0;
  z-index: 500;
  overflow: hidden;
  line-height: 0;
  text-align: center;
}

.site-ad-left .ad-label {
  display: block;
  width: 160px;
  height: 25px;
  padding: 5px 2px;
  color: #888;
  background: #080808;
  font-size: 10px;
  line-height: 15px;
  font-family: "Segoe UI", Arial, sans-serif;
  white-space: nowrap;
}

.site-ad-left iframe {
  display: block;
  width: 160px !important;
  height: 600px !important;
  max-width: none;
  border: 0;
  margin: 0;
  padding: 0;
}

/* =========================================================
   PAGE
   ========================================================= */

.page {
  width: min(1500px, calc(100% - 36px));
  max-width: 1500px;
  margin: 0 auto;
  padding: 72px clamp(18px, 4vw, 55px) 80px;
  position: relative;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
  text-align: center;
  position: relative;
  margin-bottom: 42px;
}

.hero-glow {
  position: absolute;
  width: min(700px, 85vw);
  height: 260px;
  left: 50%;
  top: -55px;
  transform: translateX(-50%);
  background: radial-gradient(
    ellipse,
    rgba(255,0,0,.18),
    transparent 68%
  );
  filter: blur(10px);
  pointer-events: none;
  animation: pulse 4s ease-in-out infinite;
}

.hero > *:not(.hero-glow) {
  position: relative;
  z-index: 1;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #660000;
  border-radius: 999px;
  padding: 7px 13px;
  color: #ff7777;
  background: rgba(20,0,0,.8);
  font-size: .75em;
  font-weight: 800;
  letter-spacing: 2px;
  box-shadow: 0 0 16px rgba(255,0,0,.25);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff2222;
  box-shadow: 0 0 10px #ff0000;
  animation: blink 1.5s infinite;
}

.hero h1 {
  margin: 18px 0 8px;
  font-size: clamp(2.5em, 6vw, 4em);
  color: #ff1111;
  text-shadow:
    0 0 20px #ff0000,
    0 0 45px rgba(255,0,0,.3);
}

.hero h1 span {
  color: #fff;
  text-shadow:
    0 0 14px #fff,
    0 0 28px rgba(255,0,0,.8);
}

.hero p {
  max-width: 720px;
  margin: 0 auto;
  color: #aaa;
  line-height: 1.6;
  font-size: 1.05em;
}

/* =========================================================
   SEARCH + FILTERS
   ========================================================= */

.controls {
  position: relative;
  z-index: 2;
  width: min(900px, 100%);
  margin: 0 auto 38px;
}

.search-wrap {
  position: relative;
}

.search {
  width: 100%;
  height: 54px;
  padding: 0 20px 0 50px;
  border: 2px solid #3a0000;
  border-radius: 12px;
  outline: none;
  background: #111;
  color: #fff;
  font-size: 1em;
  box-shadow: 0 0 18px rgba(255,0,0,.15);
  transition: .25s ease;
}

.search:focus {
  border-color: #ff0000;
  box-shadow: 0 0 22px rgba(255,0,0,.35);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #ff4444;
  pointer-events: none;
}

.filters {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 13px;
  width: 100%;
}

.filter {
  appearance: none;
  border: 1px solid #431313;
  background: #101010;
  color: #aaa;
  border-radius: 999px;
  padding: 8px 15px;
  cursor: pointer;
  font: inherit;
  font-size: .84em;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  transition:
    transform .2s ease,
    color .2s ease,
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.filter:hover {
  color: #fff;
  border-color: #ff3333;
  background: #210000;
  transform: translateY(-2px);
  box-shadow: 0 0 14px rgba(255,0,0,.22);
}

.filter.active {
  color: #fff;
  border-color: #ff1111;
  background: linear-gradient(180deg, #3b0000, #1d0000);
  box-shadow:
    0 0 16px rgba(255,0,0,.38),
    inset 0 0 8px rgba(255,0,0,.12);
  transform: translateY(-1px);
}

/* =========================================================
   GAME AREA
   ========================================================= */

.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
  color: #777;
  font-size: .9em;
}

.results-bar strong {
  color: #ff5555;
}

.games-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 300px));
  justify-content: center;
  align-items: start;
  gap: 34px 26px;
}

.game-card {
  width: 300px;
  max-width: 100%;
  background: linear-gradient(180deg, #151515, #0d0d0d);
  border: 2px solid #300000;
  border-radius: 14px;
  padding: 12px 0 14px;
  overflow: hidden;
  box-shadow: 0 0 15px rgba(255,0,0,.45);
  transition: .3s ease;
  animation: cardIn .55s ease both;
}

.game-card:hover {
  transform: translateY(-6px);
  border-color: #650000;
  box-shadow: 0 0 28px rgba(255,0,0,.75);
}

.game-thumb {
  width: 256px;
  height: 256px;
  margin: 0 auto;
  display: block;
  border-radius: 8px;
  background: #151515 center / cover no-repeat;
  box-shadow:
    0 0 0 1px #250000,
    0 0 14px rgba(255,0,0,.18);
}

.game-name {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px 16px 7px;
  font-size: 1.18em;
  font-weight: 750;
  color: #fff;
}

.game-bar {
  width: calc(100% - 20px);
  margin: 0 auto;
  display: flex;
  gap: 8px;
  padding: 7px;
  background: #090909;
  border: 2px solid #300000;
  border-radius: 10px;
}

.game-bar button {
  flex: 1;
  min-width: 0;
  border: 2px solid #ff0000;
  border-radius: 8px;
  padding: 8px 10px;
  background: #111;
  color: #fff;
  cursor: pointer;
  transition: .2s ease;
}

.game-bar button:hover {
  background: #330000;
  box-shadow: 0 0 14px #ff3333;
  transform: translateY(-1px);
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 55px 20px;
  color: #777;
  border: 1px dashed #3b1111;
  border-radius: 14px;
  width: min(700px, 100%);
}

/* =========================================================
   MODALS
   ========================================================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.84);
  justify-content: center;
  align-items: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}

.modal.open {
  display: flex;
}

/* =========================================================
   LAUNCH OPTIONS
   ========================================================= */

#popup-box {
  width: min(700px, 95vw);
  background: #111;
  border: 2px solid #ff0000;
  padding: 28px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 0 35px #ff0000;
}

.popup-header {
  position: relative;
  display: flex;
  justify-content: center;
  margin-bottom: 22px;
}

.popup-header h3 {
  margin: 0;
  font-size: 1.45em;
  text-shadow: 0 0 10px #ff0000;
}

.close {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  color: #ff4444;
  font-size: 1.8em;
  cursor: pointer;
}

.close:hover {
  color: #fff;
  text-shadow: 0 0 12px #ff0000;
}

.launch-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.popup-btn {
  min-height: 58px;
  border: 2px solid #ff0000;
  border-radius: 9px;
  background: #111;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: .2s ease;
}

.popup-btn:hover {
  background: #330000;
  box-shadow: 0 0 18px #ff3333;
  transform: translateY(-2px);
}

/* =========================================================
   INFO POPUP
   ========================================================= */

#info-popup-box {
  width: min(500px, calc(100vw - 32px));
  max-height: min(430px, calc(100vh - 32px));
  background: #0f0f0f;
  border: 1px solid #ff2222;
  border-radius: 14px;
  overflow: hidden;
  box-shadow:
    0 0 22px rgba(255,0,0,.55),
    0 0 60px rgba(255,0,0,.16);
  animation: infoIn .2s ease-out;
}

.info-header {
  position: relative;
  min-height: 68px;
  display: flex;
  align-items: center;
  padding: 16px 54px 16px 22px;
  border-bottom: 1px solid #2b2b2b;
  background: linear-gradient(180deg, #171717, #101010);
}

.info-title {
  margin: 0;
  font-size: 1.35em;
  font-weight: 750;
  color: #fff;
  text-shadow: 0 0 10px rgba(255,0,0,.35);
}

.info-header .close {
  right: 17px;
  font-size: 1.45em;
}

.info-body {
  padding: 18px 22px 20px;
}

.info-label {
  display: block;
  margin-bottom: 8px;
  color: #ff4b4b;
  font-size: .72em;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.info-text {
  margin: 0;
  color: #ddd;
  line-height: 1.55;
  font-size: .96em;
}

.info-footer {
  margin-top: 17px;
  padding-top: 13px;
  border-top: 1px solid #292929;
  color: #777;
  font-size: .78em;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes pulse {
  0%,100% {
    opacity: .6;
    transform: translateX(-50%) scale(.97);
  }

  50% {
    opacity: 1;
    transform: translateX(-50%) scale(1.04);
  }
}

@keyframes blink {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes infoIn {
  from {
    opacity: 0;
    transform: scale(.97) translateY(6px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* =========================================================
   LARGE SCREENS
   ========================================================= */

@media (min-width: 1401px) {

  .navbar .left {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }

  .navbar .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
  }

  .navbar .tabs {
    flex-wrap: nowrap;
  }

  .page {
    width: min(1500px, calc(100% - 36px));
    margin: 0 auto;
  }
}

/* =========================================================
   TABLET / CHROMEBOOK
   ========================================================= */

@media (max-width: 1400px) {

  .navbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: auto;
    padding: 9px 12px 10px;
  }

  .navbar .left {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px 12px;
  }

  .navbar .center {
    position: static;
    width: 100%;
    transform: none;
  }

  .navbar .tabs {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
  }

  .navbar .tab {
    padding: 7px 10px;
    font-size: .86em;
  }

  .site-ad-left {
    display: none;
  }

  .page {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 48px clamp(14px, 4vw, 55px) 70px;
  }

  .games-grid {
    grid-template-columns: repeat(auto-fit, minmax(280px, 300px));
    justify-content: center;
    gap: 30px 18px;
  }
}

/* =========================================================
   SHORT SCREENS
   ========================================================= */

@media (min-width: 1201px) and (max-height: 700px) {

  .site-ad-left {
    display: none;
  }

  .page {
    padding-top: 42px;
  }
}

/* =========================================================
   SMALL TABLET
   ========================================================= */

@media (max-width: 900px) {

  .navbar {
    gap: 7px;
    padding: 8px 8px 9px;
  }

  .navbar .left {
    gap: 5px 10px;
  }

  .navbar .tabs {
    gap: 4px;
  }

  .navbar .tab {
    padding: 6px 9px;
    font-size: .73em;
  }

  .page {
    padding: 34px 12px 60px;
  }

  .hero h1 {
    font-size: clamp(2.05rem, 7vw, 3.1rem);
  }

  .hero p {
    width: min(100%, 700px);
    font-size: .94em;
  }

  .controls {
    width: min(100%, 760px);
  }

  .games-grid {
    grid-template-columns: repeat(auto-fit, minmax(260px, 300px));
    justify-content: center;
    gap: 24px 14px;
  }

  .game-card {
    width: min(300px, 100%);
  }
}

/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

  .navbar .left {
    flex-direction: column;
    gap: 2px;
  }

  .navbar .logo {
    font-size: 1.2em;
  }

  .navbar .datetime {
    font-size: .68em;
  }

  .navbar .tabs {
    gap: 4px;
  }

  .navbar .tab {
    padding: 6px 7px;
    font-size: .68em;
  }

  .page {
    padding: 28px 10px 50px;
  }

  .hero h1 {
    font-size: clamp(1.9rem, 10vw, 2.65rem);
  }

  .hero p {
    font-size: .9em;
    line-height: 1.5;
  }

  .search {
    height: 50px;
    padding-left: 44px;
  }

  .filters {
    gap: 6px;
  }

  .filter {
    padding: 7px 10px;
  }

  .games-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .game-card {
    width: min(300px, calc(100vw - 24px));
  }

  .game-thumb {
    width: min(256px, calc(100% - 20px));
    height: min(256px, calc(100% - 20px));
  }

  .results-bar {
    align-items: flex-start;
    flex-direction: column;
  }

  #popup-box {
    padding: 18px;
  }

  .launch-grid {
    grid-template-columns: 1fr;
  }

  #info-popup-box {
    width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
  }

  .game-card:hover,
  .filter:hover,
  .popup-btn:hover {
    transform: none;
  }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 420px) {

  .tabs {
    gap: 4px;
  }

  .tab {
    padding: 6px 7px;
    font-size: .7em;
  }

  .search {
    height: 50px;
    font-size: .9em;
  }

  .game-card {
    width: min(300px, calc(100vw - 24px));
  }
}

/* Prevent hover movement on touch devices */
@media (hover: none) {

  .game-card:hover,
  .popup-btn:hover,
  .filter:hover {
    transform: none;
  }
}
</style>
</head>

<!-- =======================================================

      <button

      <button

      >
        Open In About:Blank Window
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     INFO POPUP
     ======================================================= -->

<div
  id="info-popup"
  class="modal"
  onclick="closeInfoBackdrop(event)"
>

  <div
    id="info-popup-box"
    onclick="event.stopPropagation()"
  >

    <div class="info-header">

      <div
        class="close"
        onclick="closeInfoPopup()"
      >
        ✕
      </div>

      <div
        class="info-title"
        id="info-title"
      >
        Game
      </div>

    </div>

    <div class="info-body">

      <div
        class="info-label"
        id="info-category"
      >
        Game Information
      </div>

      <p
        class="info-text"
        id="info-text"
      ></p>

      <div class="info-footer">
        Pick Play to choose how you want to launch the game.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   GAME DATA
   ========================================================= */

const games = [

  {
    name: "Retrobowl",
    image: "Img/retrobowl.png",
    url: "HTML/RB.html",
    category: "Sports",
    description: "A retro-style football game."
  },

  {
    name: "Minecraft",
    image: "Img/MC.png",
    url: "Games/Minecraft.html",
    category: "Adventure",
    description: "Explore, build, and survive in a blocky sandbox world."
  },

  {
    name: "Cookie Clicker",
    image: "Img/cookieclicker.png",
    url: "HTML/CKCL.html",
    category: "Casual",
    description: "Idle clicker game where you bake absurd amounts of cookies."
  },

  {
    name: "1v1.LOL",
    image: "Img/1v1lol.png",
    url: "Games/1v1.html",
    category: "Action",
    description: "Fast-paced build-and-shoot arena battles."
  },

  {
    name: "Drift Hunters",
    image: "Img/drifthunt.png",
    url: "HTML/DH.html",
    category: "Racing",
    description: "Realistic drifting with customizable cars and tracks."
  },

  {
    name: "BitLife",
    image: "Img/bitlife.png",
    url: "Games/BitLife.html",
    category: "Casual",
    description: "Life simulator where every choice shapes your story."
  },

  {
    name: "Slope",
    image: "Img/slope.png",
    url: "Games/Slope.html",
    category: "Arcade",
    description: "Fast, endless downhill ball-rolling challenge."
  },

  {
    name: "Run 3",
    image: "Img/run3.png",
    url: "Games/Run3.html",
    category: "Arcade",
    description: "Run through space tunnels with gravity-bending paths."
  }

];


/* =========================================================
   ELEMENTS
   ========================================================= */

const grid =
  document.getElementById("games-grid");

const search =
  document.getElementById("game-search");

const filters =
  document.getElementById("filters");

const gameCount =
  document.getElementById("game-count");

const activeFilterText =
  document.getElementById("active-filter");

let selectedCategory = "All";
let currentGameURL = "";


/* =========================================================
   CATEGORIES
   ========================================================= */

const categories = [
  "All",
  ...new Set(games.map(game => game.category))
];


/* =========================================================
   FILTERS
   ========================================================= */

function renderFilters() {

  filters.innerHTML = categories.map(category => `

    <button
      type="button"
      class="filter ${category === selectedCategory ? "active" : ""}"
      data-category="${escapeHTML(category)}"
      aria-pressed="${category === selectedCategory}"
    >
      ${
        category === "All"
          ? "All Games"
          : escapeHTML(category)
      }
    </button>

  `).join("");


  filters
    .querySelectorAll(".filter")
    .forEach(button => {

      button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        setCategory(this.dataset.category);

      });

    });

}


/* =========================================================
   GAME RENDERING
   ========================================================= */

function renderGames() {

  const term =
    search.value
      .trim()
      .toLowerCase();


  const visibleGames =
    games.filter(game => {

      const categoryMatch =
        selectedCategory === "All" ||
        game.category === selectedCategory;


      const searchMatch =
        !term ||
        game.name.toLowerCase().includes(term) ||
        game.category.toLowerCase().includes(term) ||
        game.description.toLowerCase().includes(term);


      return categoryMatch && searchMatch;

    });


  gameCount.textContent =
    visibleGames.length;


  activeFilterText.textContent =
    selectedCategory === "All"
      ? "All Games"
      : selectedCategory;


  if (!visibleGames.length) {

    grid.innerHTML = `

      <div class="empty">

        <div
          style="
            font-size:2em;
            margin-bottom:8px;
          "
        >
          🔎
        </div>

        No games found.<br>

        <span style="font-size:.9em;">
          Try another search or category.
        </span>

      </div>

    `;

    return;
  }


  grid.innerHTML =
    visibleGames.map((game, index) => `

      <article
        class="game-card"
        style="
          animation-delay:${Math.min(index * 45, 400)}ms
        "
      >

        <div
          class="game-thumb"
          style="
            background-image:url('${escapeAttribute(game.image)}')
          "
          role="img"
          aria-label="${escapeAttribute(game.name)}"
        ></div>


        <div class="game-name">
          ${escapeHTML(game.name)}
        </div>


        <div class="game-bar">

          <button
            onclick="openPlayPopup('${escapeJS(game.url)}')"
          >
            ▶ Play
          </button>

          <button
            onclick="openInfoPopup(
              '${escapeJS(game.name)}',
              '${escapeJS(game.description)}',
              '${escapeJS(game.category)}'
            )"
          >
            ℹ Info
          </button>

        </div>

      </article>

    `).join("");

}


/* =========================================================
   CATEGORY SELECTION
   ========================================================= */

function setCategory(category) {

  if (!categories.includes(category)) {
    category = "All";
  }

  selectedCategory = category;


  document
    .querySelectorAll(".filter")
    .forEach(button => {

      const isActive =
        button.dataset.category === selectedCategory;

      button.classList.toggle(
        "active",
        isActive
      );

      button.setAttribute(
        "aria-pressed",
        String(isActive)
      );

    });


  renderGames();

}


/* =========================================================
   SECURITY / ESCAPING
   ========================================================= */

function escapeHTML(value) {

  return String(value).replace(
    /[&<>"']/g,
    char => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[char])
  );

}


function escapeAttribute(value) {

  return String(value).replace(
    /["'\\]/g,
    "\\$&"
  );

}


function escapeJS(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
  "input",
  renderGames
);


/* =========================================================
   DATE / TIME
   ========================================================= */

function updateDateTime() {

  const now = new Date();

  const month =
    now.toLocaleString(
      "en-US",
      { month: "long" }
    );

  const day =
    now.getDate();

  const year =
    now.getFullYear();


  let hours =
    now.getHours();

  const minutes =
    String(now.getMinutes())
      .padStart(2, "0");

  const seconds =
    String(now.getSeconds())
      .padStart(2, "0");


  const ampm =
    hours >= 12
      ? "PM"
      : "AM";


  hours =
    hours % 12 || 12;


  document.getElementById(
    "datetime"
  ).textContent =
    `${month} ${day}, ${year} • ${hours}:${minutes}:${seconds} ${ampm}`;

}


setInterval(
  updateDateTime,
  1000
);

updateDateTime();


/* =========================================================
   NAVIGATION
   ========================================================= */

function goHome() {

  window.location.href =
    "index.html";

}


function blocked() {

  window.location.href =
    "unfin.html";

}


/* =========================================================
   PLAY POPUP
   ========================================================= */

function openPlayPopup(url) {

  currentGameURL = url;

  document
    .getElementById("popup")
    .classList.add("open");

}


function closePlayPopup() {

  document
    .getElementById("popup")
    .classList.remove("open");

}


function closePlayBackdrop(event) {

  if (
    event.target ===
    document.getElementById("popup")
  ) {

    closePlayPopup();

  }

}


/* =========================================================
   INFO POPUP
   ========================================================= */

function openInfoPopup(
  title,
  text,
  category = "Game Information"
) {

  document.getElementById(
    "info-title"
  ).textContent = title;

  document.getElementById(
    "info-category"
  ).textContent = category;

  document.getElementById(
    "info-text"
  ).textContent = text;

  document
    .getElementById("info-popup")
    .classList.add("open");

}


function closeInfoPopup() {

  document
    .getElementById("info-popup")
    .classList.remove("open");

}


function closeInfoBackdrop(event) {

  if (
    event.target ===
    document.getElementById("info-popup")
  ) {

    closeInfoPopup();

  }

}


/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {

      closePlayPopup();
      closeInfoPopup();

    }

  }
);


/* =========================================================
   GAME LAUNCHERS
   ========================================================= */

function openTab() {

  window.open(
    currentGameURL,
    "_blank"
  );

  closePlayPopup();

}


/* =========================================================
   ABOUT:BLANK WRAPPER
   ========================================================= */

function wrapper(url) {

  return `

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <title>SGS</title>

      <style>

        html,
        body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #000;
        }

        iframe {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          border: 0;
          background: #000;
        }

      </style>

    </head>

    <body>

      <iframe
        src="${escapeAttribute(url)}"
      ></iframe>

    </body>

    </html>

  `;

}


/* =========================================================
   ABOUT:BLANK TAB
   ========================================================= */

function openABTab() {

  const win =
    window.open(
      "about:blank",
      "_blank"
    );


  if (!win) {
    return;
  }


  win.document.open();

  win.document.write(
    wrapper(currentGameURL)
  );

  win.document.close();

  closePlayPopup();

}


/* =========================================================
   NORMAL WINDOW
   ========================================================= */

function openWindow() {

  window.open(
    currentGameURL,
    "",
    "width=1100,height=700,resizable=yes,scrollbars=yes"
  );

  closePlayPopup();

}


/* =========================================================
   ABOUT:BLANK WINDOW
   ========================================================= */

function openABWindow() {

  const win =
    window.open(
      "about:blank",
      "",
      "width=1100,height=700,resizable=yes,scrollbars=yes"
    );


  if (!win) {
    return;
  }


  win.document.open();

  win.document.write(
    wrapper(currentGameURL)
  );

  win.document.close();

  closePlayPopup();

}


/* =========================================================
   INITIALIZE
   ========================================================= */

renderFilters();
renderGames();

</script>

</body>
</html>

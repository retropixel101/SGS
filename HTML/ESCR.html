<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- All game assets are loaded relative to ESCRDA -->
  <base href="./ESCRDA/">

  <title>Escape Road</title>

  <link rel="shortcut icon" href="icon.png">
  <link rel="stylesheet" href="TemplateData/style.css">

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

  <style>
    @font-face {
      font-family: myFirstFont;
      src: url("Chainwhacks.otf");
    }

    #logo-canvas,
    body {
      font-family: myFirstFont;
    }
  </style>
</head>

<body class="dark">

  <div id="unity-container" class="unity-desktop">
    <p style="opacity: 0; position: absolute;">_</p>
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loading-cover" style="display:none; background:black;">
    <div id="unity-loading-bar">

      <canvas
        id="logo-canvas"
        style="position:absolute; background-color:black;"
      >
        <img src="loading.png" id="ld_bg">
        <img src="car-icon.png" id="ld_car">
      </canvas>

    </div>
  </div>

  <img id="azlogo" class="az" src="az_logo.png">

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");

    const buildUrl = "TemplateData";
    const loaderUrl = buildUrl + "/loader.js";

    const config = {
      dataUrl: buildUrl + "/data.unityweb",
      frameworkUrl: buildUrl + "/framework.js.unityweb",
      codeUrl: buildUrl + "/wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",

      companyName: "1games.io",
      productName: "Escape Road",
      productVersion: "2.0"
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    function delay(ms) {
      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });
    }

    async function load() {
      const az_logo = document.getElementById("azlogo");

      az_logo.style.opacity = 0;
      logo_loaded = true;

      az_logo.style.display = "none";
      logo_loaded = false;

      createUnityInstance(
        canvas,
        config,
        (progress) => {
          logo_loading_percent = progress;
          drawCanvas(progress);
        }
      )
      .then((unityInstance) => {
        window.unityInstance = unityInstance;

        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
          window.focus();
        }, 2000);
      })
      .catch((message) => {
        console.error("Unity failed to load:", message);
        alert(message);
      });
    }

    loadingCover.style.display = "";

    let script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      load();
    };

    script.onerror = () => {
      console.error("Failed to load Unity loader:", loaderUrl);
    };

    let logo_loaded = false;
    let logo_loading_percent = 0;

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    };

    window.onload = () => {
      drawCanvas(logo_loading_percent);
    };

    const logo_canvas = document.getElementById("logo-canvas");

    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }

      resizeLogoCanvas();

      const ctx = logo_canvas.getContext("2d");

      const ld_bg = document.getElementById("ld_bg");
      const ld_car = document.getElementById("ld_car");

      const _sw = logo_canvas.width / 1920;
      const _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }

      const bgbar_H = 86;
      const bgbar_W = 1383;

      const fillbar_H = 55;
      const fillbar_W = 1345;

      const maskbar_H = 55;
      const maskbar_W = 1350;

      const bgbar_mask_H = 86;
      const bgbar_mask_W = 1383;

      const posshowbar_Y = 200;

      const posbgbar_X = (1920 - bgbar_W) / 2;
      const posbgbar_Y = posshowbar_Y;

      const posfillbar_X = (1920 - fillbar_W) / 2;
      const posfillbar_Y = posshowbar_Y - 15;

      const posmaskbar_X = (1920 - maskbar_W) / 2;
      const posmaskbar_Y = posshowbar_Y - 15;

      const _fl = 0;
      const _fl1 = posmaskbar_X + _percent * maskbar_W;

      const _fw = maskbar_W - _percent * maskbar_W;

      // Background
      ctx.drawImage(
        ld_bg,
        0,
        0,
        logo_canvas.width,
        logo_canvas.height
      );

      // Loading background
      ctx.fillStyle = "#977e21";

      const _lw = 700;
      const _lh = 50;

      ctx.fillRect(
        (1920 - _lw) * 0.5 * _sw,
        (1080 - 150) * _sh,
        _lw * _sw,
        _lh * _sh
      );

      // Loading progress
      ctx.fillStyle = "#fad234";

      const _pad = 5;
      const _pw = _lw - _pad * 2;
      const _ph = _lh - _pad * 2;
      const _px = (1920 - _pw) * 0.5;

      ctx.fillRect(
        _px * _sw,
        (1080 - 150 + _pad) * _sh,
        _pw * _percent * _sw,
        _ph * _sh
      );

      // Car position
      let _car_x = _px + _pw * _percent - 100;

      if (_car_x < _px) {
        _car_x = _px;
      }

      ctx.font = "18px myFirstFont";

      const match = /(?<value>\d+\.?\d*)/;

      const setFontSize = (size) => {
        ctx.font = ctx.font.replace(match, size);
      };

      setFontSize(35 * _sh);

      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "black";
      ctx.shadowOffsetY = 2;

      const new_per = parseInt(_percent * 100);

      ctx.fillText(
        "" + new_per + "%",
        logo_canvas.width / 2,
        logo_canvas.height / 2 + _sh * 425
      );
    }

    function resizeLogoCanvas() {
      const _w = window.innerWidth;
      const _h = window.innerHeight;

      const _nw = _h * 16 / 9;

      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      } else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
    }

    document.body.appendChild(script);
  </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGS - Password Required</title>

<link rel="icon" type="image/png" href="Img/SGS.png">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #d60000
    );

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 2px 15px rgba(255, 0, 0, 0.55);

    z-index: 10;
}

.topbar-title {
    font-size: 21px;
    font-weight: 800;
}

/* =========================================================
   CARD
   ========================================================= */

.container {
    width: min(560px, calc(100% - 30px));
    margin-top: 50px;
}

.card {
    width: 100%;

    background: linear-gradient(
        145deg,
        #171717,
        #101010
    );

    border: 2px solid #ff1717;
    border-radius: 18px;

    padding: 38px 36px 34px;

    text-align: center;

    box-shadow:
        0 0 10px rgba(255, 0, 0, 0.7),
        0 0 30px rgba(255, 0, 0, 0.35);
}

/* =========================================================
   BADGE
   ========================================================= */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 8px 15px;

    border: 1px solid #7d0000;
    border-radius: 30px;

    color: #ff3333;

    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;

    margin-bottom: 25px;
}

.badge-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #ff2222;

    box-shadow:
        0 0 8px #ff0000;
}

/* =========================================================
   TITLE
   ========================================================= */

h1 {
    margin: 0 0 14px;

    color: #ff1717;

    font-size: clamp(34px, 7vw, 50px);
    line-height: 1.05;

    text-shadow:
        0 0 10px rgba(255, 0, 0, 0.8),
        0 0 25px rgba(255, 0, 0, 0.35);
}

.description {
    margin: 0 auto 28px;

    max-width: 440px;

    color: #c7c7c7;

    font-size: 15px;
    line-height: 1.7;
}

/* =========================================================
   INPUT
   ========================================================= */

.password-input {
    width: 100%;

    height: 54px;

    padding: 0 18px;

    background: #070707;

    border: 1px solid #750000;
    border-radius: 11px;

    outline: none;

    color: white;

    text-align: center;

    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;

    transition: 0.2s;
}

.password-input:focus {
    border-color: #ff1717;

    box-shadow:
        0 0 10px rgba(255, 0, 0, 0.35);
}

.password-input::placeholder {
    color: #555;
    letter-spacing: 0;
}

/* =========================================================
   BUTTON
   ========================================================= */

.unlock-button {
    width: 100%;

    height: 54px;

    margin-top: 14px;

    background: transparent;

    border: 2px solid #ff1717;
    border-radius: 11px;

    color: white;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    transition:
        background 0.2s,
        box-shadow 0.2s,
        transform 0.15s;
}

.unlock-button:hover {
    background: #ff1717;

    box-shadow:
        0 0 15px rgba(255, 0, 0, 0.6);
}

.unlock-button:active {
    transform: scale(0.98);
}

.unlock-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

/* =========================================================
   STATUS
   ========================================================= */

.status {
    min-height: 24px;

    margin-top: 16px;

    color: #aaa;

    font-size: 14px;
}

.status.error {
    color: #ff3333;
}

.status.success {
    color: #45ff72;
}

/* =========================================================
   LOCKOUT
   ========================================================= */

.lockout {
    display: none;

    margin-top: 18px;

    padding: 15px;

    border: 1px solid #700000;
    border-radius: 10px;

    background: #090909;

    color: #ff3333;
}

.lockout-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
}

.lockout-time {
    margin-top: 7px;

    font-size: 25px;
    font-weight: 900;

    color: #ff1717;

    text-shadow:
        0 0 10px rgba(255, 0, 0, 0.6);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .card {
        padding: 30px 20px 28px;
        border-radius: 15px;
    }

    .badge {
        margin-bottom: 20px;
    }

    .description {
        font-size: 14px;
    }

    .topbar-title {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="topbar-title">
        Secret Game Site
    </div>
</div>

<div class="container">

    <div class="card">

        <div class="badge">
            <span class="badge-dot"></span>
            SGS • SECURE
        </div>

        <h1>Password Required</h1>

        <p class="description">
            Enter the current SGS access password to continue.
            The password changes automatically every 2 minutes.
        </p>

        <form id="passwordForm">

            <input
                id="password"
                class="password-input"
                type="password"
                autocomplete="off"
                placeholder="Enter access password"
                required
            >

            <button
                id="unlockButton"
                class="unlock-button"
                type="submit"
            >
                Enter SGS
            </button>

        </form>

        <div
            id="status"
            class="status"
        ></div>

        <div
            id="lockout"
            class="lockout"
        >
            <div class="lockout-title">
                IP TEMPORARILY LOCKED
            </div>

            <div
                id="lockoutTime"
                class="lockout-time"
            >
                5:00
            </div>
        </div>

    </div>

</div>

<script>

/* =========================================================
   CONFIG
   ========================================================= */

const WORKER_URL =
    "https://sgs-pswrd.retropixel404.workers.dev";

const MAIN_PAGE =
    "index.html";


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
    document.getElementById("passwordForm");

const passwordInput =
    document.getElementById("password");

const unlockButton =
    document.getElementById("unlockButton");

const status =
    document.getElementById("status");

const lockout =
    document.getElementById("lockout");

const lockoutTime =
    document.getElementById("lockoutTime");


/* =========================================================
   LOCKOUT TIMER
   ========================================================= */

let lockoutInterval = null;

function startLockout(seconds) {

    clearInterval(lockoutInterval);

    lockout.style.display = "block";

    passwordInput.disabled = true;
    unlockButton.disabled = true;

    let remaining = Math.max(
        0,
        Math.ceil(Number(seconds))
    );

    function update() {

        const minutes =
            Math.floor(remaining / 60);

        const secs =
            remaining % 60;

        lockoutTime.textContent =
            `${minutes}:${String(secs).padStart(2, "0")}`;

        if (remaining <= 0) {

            clearInterval(lockoutInterval);

            lockout.style.display = "none";

            passwordInput.disabled = false;
            unlockButton.disabled = false;

            passwordInput.value = "";

            status.textContent =
                "Lockout expired. You may try again.";

            status.className =
                "status";

            return;
        }

        remaining--;
    }

    update();

    lockoutInterval =
        setInterval(update, 1000);
}


/* =========================================================
   CHECK CURRENT SESSION
   ========================================================= */

async function checkSession() {

    try {

        const response =
            await fetch(
                `${WORKER_URL}/current`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (data.authenticated) {

            window.location.href =
                MAIN_PAGE;
        }

    } catch (error) {

        console.log(
            "Session check failed:",
            error
        );
    }
}


/* =========================================================
   VERIFY PASSWORD
   ========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const password =
            passwordInput.value.trim();

        if (!password) {
            return;
        }

        unlockButton.disabled = true;

        status.textContent =
            "Checking password...";

        status.className =
            "status";

        try {

            const response =
                await fetch(
                    `${WORKER_URL}/verify`,
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                password: password
                            })
                    }
                );

            const data =
                await response.json();


            /* =========================================
               LOCKED
               ========================================= */

            if (
                response.status === 429 ||
                data.locked === true
            ) {

                status.textContent =
                    "Too many failed attempts.";

                status.className =
                    "status error";

                startLockout(
                    data.remaining || 300
                );

                return;
            }


            /* =========================================
               SUCCESS
               ========================================= */

            if (
                response.ok &&
                data.success === true &&
                data.authenticated === true
            ) {

                status.textContent =
                    "Access granted.";

                status.className =
                    "status success";

                unlockButton.textContent =
                    "Entering SGS...";

                /*
                 * Give the browser a tiny moment to
                 * receive/store the cookie before
                 * navigating.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            MAIN_PAGE;

                    },
                    150
                );

                return;
            }


            /* =========================================
               WRONG PASSWORD
               ========================================= */

            if (data.success === false) {

                const attempts =
                    Number(data.attempts) || 0;

                const remainingAttempts =
                    Number(
                        data.remainingAttempts
                    );

                if (
                    Number.isFinite(
                        remainingAttempts
                    )
                ) {

                    status.textContent =
                        `Incorrect password. ` +
                        `${remainingAttempts} ` +
                        `attempt${remainingAttempts === 1 ? "" : "s"} remaining.`;

                } else {

                    status.textContent =
                        "Incorrect password.";
                }

                status.className =
                    "status error";

                passwordInput.value = "";

                unlockButton.disabled = false;

                passwordInput.focus();

                return;
            }


            /* =========================================
               UNKNOWN RESPONSE
               ========================================= */

            status.textContent =
                "Unexpected response from password server.";

            status.className =
                "status error";

            unlockButton.disabled = false;

        } catch (error) {

            console.error(error);

            status.textContent =
                "Could not contact the password server.";

            status.className =
                "status error";

            unlockButton.disabled = false;
        }

    }
);


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>

</body>
</html>
